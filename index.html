<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lee Nara — UI Designer Portfolio</title>
<meta name="description" content="반응형 웹, 관리자 UI, 모바일 서비스, 대시보드를 설계해 온 UI 디자이너 이나라의 포트폴리오입니다.">
<meta name="robots" content="noindex, nofollow"><!-- 공개 전까지 검색 노출 차단 · 공개 시 삭제 -->
<meta name="theme-color" content="#111214">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap">
<style>
@font-face{font-family:"Pretendard Variable";src:url(fonts/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}

/* ===== Tokens (피그마 변수와 같은 이름) ===== */
:root{
  --bg-base:#111214; --bg-surface:#17181B; --bg-elevated:#1A1B1E; --bg-placeholder:#1E2024;
  --text-primary:#F4F5F6; --text-secondary:#C9CDD3; --text-tertiary:#9AA0AA; --text-disabled:#6E747E; --text-on-accent:#111214;
  --border-default:#2D3036; --border-strong:#F4F5F6; --border-dashed:#3A3E45;
  --accent:#4FD1C0; --accent-hover:#56DECC; --glow:#1F8F84;
  --overlay-dim:rgba(5,6,7,.72); --overlay-bar:rgba(23,24,27,.92); --caption-start:rgba(17,18,20,.7744);
  --f-en:"Archivo", "Pretendard Variable", system-ui, sans-serif;
  --f-kr:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  --gutter:48px;   /* 좌우 여백 */
  --inset:20px;    /* 이미지 굴곡에 맞춘 글자 시작선 (48 + 20) */
  --hh:92px;       /* 헤더 높이 */
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
  /* 와이어프레임 화면용 별칭 (화면 시안 반영 전까지 유지) */
  --bg:var(--bg-base); --surface:var(--bg-surface); --fg:var(--text-primary); --muted:var(--text-tertiary);
  --line:var(--border-default); --ph:var(--bg-placeholder); --ph-line:var(--border-dashed); --scrim:var(--overlay-dim);
  --note:#fdba74; --note-bg:#3a2617; --r:4px;
}
@media (max-width:767px){:root{--gutter:16px;--inset:8px;--hh:68px}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg-base);color:var(--text-primary)}
html{scrollbar-gutter:stable}  /* 패널·모달로 스크롤을 잠가도 스크롤바 자리를 유지해 화면이 밀리지 않게 */
body{font-family:var(--f-kr);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.ico{display:block;flex:none}
.ico path{vector-effect:non-scaling-stroke}  /* 아이콘 선은 크기와 무관하게 1.2px */

/* ===== Header ===== */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg-base);transition:background .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg-base)}
body.contact-open::before{background:var(--bg-surface)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:var(--hh)}
.logo{font-family:var(--f-en);font-weight:800;font-size:20px;line-height:1;letter-spacing:.02em;color:var(--text-primary)}
nav.menu{display:flex;align-items:center;gap:20px}
.menu-item{display:inline-flex;align-items:center;height:44px;padding:14px 16px;border-radius:8px;font-family:var(--f-en);font-weight:600;font-size:16px;line-height:1;letter-spacing:.02em;color:var(--text-tertiary);transition:background .2s,color .2s}
.menu-item:hover{background:var(--bg-elevated)}
.menu-item[aria-current="page"]{background:var(--bg-elevated);color:var(--text-primary)}
@media (max-width:767px){
  .logo{font-size:17px}
  nav.menu{gap:4px}
  .menu-item{padding:14px 10px;font-size:15px}
}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:13px 20px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-elevated);font-family:var(--f-kr);font-weight:600;font-size:16px;line-height:1;color:var(--text-primary);text-decoration:none;white-space:nowrap;transition:background .2s}
.btn:hover{background:var(--bg-placeholder)}
.btn .lbl{padding:0 2px}
.btn .ico{width:16px;height:16px}
.btn .brand{width:16px;height:16px;border-radius:999px;background:var(--text-primary);color:var(--text-on-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn .brand svg{width:10px;height:10px}
.btn-cta{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:52px;padding:13px 32px;border-radius:999px;background:var(--accent);color:var(--text-on-accent);font-family:var(--f-en);font-weight:700;font-size:16px;line-height:1.6;text-decoration:none;white-space:nowrap;transition:background .2s}
.btn-cta:hover{background:var(--accent-hover)}
.btn-cta .lbl{padding-left:4px}
.btn-cta .ico{width:20px;height:20px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-elevated);color:var(--text-primary);transition:background .2s}
.icon-btn .ico{width:24px;height:24px}
.icon-btn:hover{background:var(--bg-placeholder)}
.icon-btn[disabled]{color:var(--text-disabled);cursor:default}
.icon-btn[disabled]:hover{background:var(--bg-elevated)}
.icon-btn.close{background:var(--text-primary);border-color:var(--text-primary);color:var(--text-on-accent)}
.icon-btn.close:hover{background:var(--text-primary)}  /* 닫기 버튼은 hover 변화 없음 */
/* 마이크로 인터랙션: 아이콘만 움직임 (마우스 기기 hover · 키보드 focus) */
.btn-cta .ico,.icon-btn.close .ico,.btn .mv-arw{transition:transform .2s var(--ease)}
.btn .ico{overflow:visible}
@media (hover:hover){
 .btn-cta:hover .ico{transform:translateX(2px)}
 .icon-btn.close:hover .ico{transform:rotate(90deg)}
 .btn[data-resume="view"]:hover .mv-arw{transform:translate(2px,-2px)}
 .btn[data-resume="down"]:hover .mv-arw{transform:translateY(2px)}
}
.btn-cta:focus-visible .ico{transform:translateX(2px)}
.icon-btn.close:focus-visible .ico{transform:rotate(90deg)}
.btn[data-resume="view"]:focus-visible .mv-arw{transform:translate(2px,-2px)}
.btn[data-resume="down"]:focus-visible .mv-arw{transform:translateY(2px)}
@media (prefers-reduced-motion:reduce){.btn-cta .ico,.icon-btn.close .ico,.btn .mv-arw{transition:none;transform:none!important}}

/* ===== Tag ===== */
.tag{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:8px 10px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-placeholder);font-family:var(--f-en);font-weight:700;font-size:12px;line-height:1;letter-spacing:.04em;color:var(--text-primary);white-space:nowrap;flex:none}

/* ===== Tabs ===== */
.tabbar{border-bottom:1px solid var(--border-default)}
.tabs{display:flex;gap:24px}
.tab{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:20px 0;border-bottom:2px solid transparent;font-family:var(--f-en);font-weight:700;font-size:18px;line-height:1;letter-spacing:.01em;color:var(--text-tertiary)}
.tab:hover{color:var(--text-primary)}
.tab[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--border-strong)}
/* 탭 밑줄 이동: JS가 밑줄 하나를 선택한 탭 아래로 옮김 (JS 없으면 위 테두리 그대로) */
.tabs{position:relative}
.tabs.has-ink .tab[aria-selected="true"]{border-bottom-color:transparent}
.tab-ink{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--border-strong);pointer-events:none;transition:transform .3s var(--ease),width .3s var(--ease)}
.tab-ink.no-anim{transition:none}
@media (prefers-reduced-motion:reduce){.tab-ink{transition:none}}

/* ===== Thumbnail cards ===== */
.card{position:relative;display:block;width:100%;text-align:left;cursor:pointer;color:inherit;text-decoration:none}
.thumb{position:relative;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);background:var(--bg-elevated)}
.thumb picture{position:absolute;inset:0}
/* 대표 이미지 레이어: 배경 + UI (같은 크기로 겹침 · hover 확대도 함께) */
@media (min-width:768px){.work-grid .card:not(.big) .tl-bg{object-position:right center}}   /* 정방형: 배경 조명(오른쪽)을 살림 */
.fig.tl-hero{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--bg-elevated)}
.fig.tl-hero img,.fig.tl-hero picture{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.card:hover .thumb img,.card:focus-visible .thumb img{transform:scale(1.06)}
@media (prefers-reduced-motion:reduce){.thumb img{transition:none}.card:hover .thumb img,.card:focus-visible .thumb img{transform:none}}
/* home: 이미지 아래 캡션 · 클릭 영역은 썸네일만 */
.card-home{position:relative}
.card-home .thumb{display:block;width:100%;aspect-ratio:16/9;border-radius:20px;cursor:pointer}
.card-home .thumb:hover img,.card-home .thumb:focus-visible img{transform:scale(1.06)}
@media (prefers-reduced-motion:reduce){.card-home .thumb:hover img,.card-home .thumb:focus-visible img{transform:none}}
.card-home .cap{display:flex;align-items:baseline;gap:16px;padding:24px var(--inset) 0}
.card-home .nm{font-family:var(--f-en);font-weight:800;font-size:22px;line-height:1.2;color:var(--text-primary)}
.card-home .ds{font-size:14px;line-height:1.6;color:var(--text-secondary)}
@media (max-width:767px){
  .card-home .thumb{border-radius:12px}
  .card-home .cap{flex-direction:column;gap:2px;padding-top:14px}
  .card-home .nm{font-size:18px}
  .card-home .ds{font-size:14px}
}
/* full · half · content: 이미지 위 캡션 */
.card-grid .thumb{border-radius:4px;height:100%}
.card-grid .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;flex-direction:column;gap:8px;padding:40px 28px 24px;background:linear-gradient(0deg,var(--caption-start) 0%,rgba(17,18,20,0) 100%);pointer-events:none}
.card-grid .nm{font-family:var(--f-en);font-weight:800;font-size:24px;line-height:1.2;letter-spacing:.005em;color:var(--text-primary)}
.card-grid .mt{font-size:15px;line-height:1.5;color:var(--text-secondary)}
@media (max-width:767px){
  .card-grid .cap{padding:32px 16px 14px;gap:4px}
  .card-grid .nm{font-size:17px}
  .card-grid .mt{font-size:13px}
  .content-grid .card-grid .cap{padding:28px 12px 12px}
  .content-grid .card-grid .nm{font-size:14px}
  .content-grid .card-grid .mt{font-size:12px;line-height:1.4}
}


/* ===== Toast ===== */
#toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:80;transform:translate(-50%,20px);opacity:0;transition:opacity .25s,transform .25s;padding:12px 20px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-elevated);font-size:16px;line-height:1.6;color:var(--text-primary);white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Footer ===== */
footer.site .wrap{padding-top:80px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.copyright{margin:0;padding:0 var(--inset);font-family:var(--f-en);font-weight:400;font-size:24px;line-height:1.2;letter-spacing:-.02em;color:var(--text-tertiary)}
@media (max-width:767px){footer.site .wrap{padding-top:56px}.copyright{font-size:18px}}

/* ===== Contact (헤더 드롭 패널 · 홈 섹션 공통 블록) ===== */
.cscrim{position:fixed;inset:0;z-index:38;background:var(--overlay-dim);opacity:0;transition:opacity .25s}
.cscrim.on{opacity:1}
.cpanel{position:fixed;left:0;right:0;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:39;background:var(--bg-surface);border-radius:0 0 20px 20px;transform:translateY(calc(-100% - var(--hh)));transition:transform .45s var(--ease);max-height:calc(100% - var(--hh) - env(safe-area-inset-top,0px));overflow-y:auto}
.cpanel.open{transform:none}
body.contact-open header.site{background:var(--bg-surface)}
body.contact-open nav.menu [data-go]{display:none}
@media (prefers-reduced-motion:reduce){.cpanel,.cscrim{transition:none}}
.contact-box{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;padding-block:80px 60px}
.contact-title{margin:0;font-family:var(--f-en);font-weight:800;font-size:100px;line-height:.92;line-height:round(.92em,1px);letter-spacing:-.02em;color:var(--text-primary)}
.contacts{display:flex;justify-content:flex-end;align-items:flex-start;gap:48px;flex-wrap:wrap}
.cgroup{display:flex;flex-direction:column;gap:16px}
.cgroup .txt{display:flex;flex-direction:column;gap:8px}
.cgroup h3{margin:0;font-family:var(--f-en);font-weight:800;font-size:20px;line-height:1.2;color:var(--text-secondary)}
.cgroup p{margin:0;font-size:14px;line-height:1.65;color:var(--text-tertiary)}
.cgroup .row{display:flex;gap:12px;flex-wrap:wrap}
/* 오른쪽 배치에서 두 그룹이 한 줄에 안 들어가면(1199 이하) 제목 아래로 내려 왼쪽 정렬 → Email · Resume 제목 줄이 항상 맞음 */
@media (max-width:1199px){.contact-box{flex-direction:column;align-items:flex-start}.contacts{justify-content:flex-start}}
@media (max-width:767px){
  .contact-box{gap:32px;padding-block:40px 32px}
  .contact-title{font-size:56px}
  .contacts{flex-direction:column;gap:28px}
}

/* ===== Modal ===== */
.scrim{position:fixed;inset:0;z-index:50;background:var(--overlay-dim);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
/* Full: 위·좌·우 24 · 아래 붙음 / Side: 위·좌우 24 · 아래 16 · 폭 640 — 오른쪽 라인 고정, 전환 시 왼쪽 끝만 움직임 */
.modal{position:fixed;z-index:55;background:var(--bg-surface);display:flex;flex-direction:column;overflow:hidden;border-radius:20px;
  top:calc(24px + env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));
  --sw:min(640px,calc(100vw - 48px));
  transition:left .5s cubic-bezier(.65,0,.25,1),bottom .5s cubic-bezier(.65,0,.25,1),border-radius .5s,transform .42s var(--ease)}
.modal.full{left:max(24px,env(safe-area-inset-left,0px));bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;transform:translateX(calc(100% + 32px))}
.modal.side{left:calc(100% - max(24px,env(safe-area-inset-right,0px)) - var(--sw));bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(calc(100% + 32px))}
.modal.open{transform:none}
/* 모바일: 모달 한 가지(Side 형태) · 사방 8 · 안에서 스크롤 */
@media (max-width:767px){.modal.side,.modal.full{top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:16px}}
@media (prefers-reduced-motion:reduce){.modal,.scrim,.m-body{transition:none}}
.m-bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 24px;background:var(--overlay-bar);flex:none}
.m-ttl{display:flex;align-items:center;gap:12px;min-width:0}
.m-ttl h2{margin:0;font-family:var(--f-kr);font-weight:800;font-size:22px;line-height:32px;letter-spacing:-.03em;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Content 모달: 한글 제목이라 한 단계 낮춤 */
.modal.is-content .m-ttl h2{font-weight:700}
@media (min-width:768px){.modal.is-content .m-ttl h2{font-size:20px;line-height:28px}}
.m-btns{display:flex;align-items:center;gap:12px;flex:none}
@media (max-width:767px){
  .m-bar{padding:8px 8px 8px 16px;gap:12px}
  .m-ttl{gap:8px}.m-ttl h2{font-size:17px;line-height:24px}
  .m-btns{gap:6px}
}
.m-body{flex:1;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain;transition:opacity .18s}
.m-body.swap{opacity:0}
.m-inner{padding:24px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:768px){.m-inner{padding:36px 40px 60px}.modal.side .m-inner{padding:8px 24px 60px}
 /* Side 모달: 카피(타이틀+캡션) 아래 → 이미지 16 */
 .modal.side .mv.ct{gap:16px}
 .modal.side .mh-title:not(:last-child){margin-bottom:-16px}}

/* ===== 배너 세트 (Mobile · PC · In-Event, 원본 그대로) ===== */
/* ===== contents tab (컴포넌트): 이미지 · 콘텐츠 안에서 보기를 바꾸는 탭 — Energy D2 Wireframe/Design, Thursday Market 배너 variation 등 =====
   알약형 바 bg-surface + border, 안쪽 4 · 버튼 높이 36(터치 44) · 좌우 16 · Archivo 600 14 · 선택 = bg-placeholder + text-primary */
.ctab{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--bg-surface);border:1px solid var(--border-default);align-self:flex-start}
.ctab button{min-width:40px;height:36px;padding:0 16px;font-variant-numeric:tabular-nums;border:0;border-radius:999px;background:none;font:600 14px/1 var(--f-en);color:var(--text-tertiary);cursor:pointer;transition:background .2s,color .2s}
.ctab button:hover{color:var(--text-primary)}
.ctab button[aria-selected="true"],.ctab button[aria-pressed="true"]{background:var(--bg-placeholder);color:var(--text-primary)}
@media (pointer:coarse){.ctab button{height:44px}}
@media (prefers-reduced-motion:reduce){.ctab button{transition:none}}
.bn-vars{margin-bottom:-8px}
.bn-set{display:flex;flex-direction:column;gap:28px;padding:20px;border-radius:16px;background:var(--bg-elevated)}
.bn-grp{display:flex;flex-direction:column;gap:12px}
.bn-row{display:grid;align-items:start;gap:12px}
.bn-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.bn-item{position:relative;border-radius:6px;overflow:hidden;background:var(--bg-placeholder)}
.bn-item>img{display:block;width:100%;height:100%;object-fit:cover}
.bn-set .bn-item .ph{width:100%;height:100%;border-radius:6px}   /* .sl-free .ph(16)보다 우선 */
@media (max-width:767px){.bn-set{padding:16px;gap:24px}.bn-row,.bn-col{gap:8px}}
/* ===== 다이어그램 (코드로 그림 · 사이트 토큰) ===== */
/* 이미지 클릭 영역 (c5 노선 바로가기) */
.fig.hot{position:relative}
.hot-spot{position:absolute;aspect-ratio:1;border:0;border-radius:50%;background:transparent;cursor:pointer;transition:box-shadow .2s}
.hot-spot:hover,.hot-spot:focus-visible{box-shadow:0 0 0 3px var(--accent),0 0 0 8px rgba(79,209,192,.25);outline:none}
.hot-back{position:sticky;bottom:20px;float:right;margin:-44px 12px 0 0;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-elevated);color:var(--text-primary);font:600 14px/1 var(--f-kr);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s,background .2s;box-shadow:0 8px 24px rgba(0,0,0,.35)}

  ["정보와 상태를 나눠, 첫 화면에 핵심을","발전소 정보와 실시간 상태를 나누고 핵심 지표를 상단에 올려, 첫 화면에서 수익과 발전량을 바로 확인하게 했습니다. 수익은 3개월 추이를, 보고서와 캘린더는 한 카드로 묶었습니다.",{diag:"energyCompare"}],
  ["화면 크기마다 배치를 다르게","넓은 화면에서는 주요 정보를 병렬로 배치하고, 보고서처럼 정보량이 적은 페이지는 읽기 폭을 제한했습니다. 모바일과 태블릿에서는 같은 정보를 한 열로 재배치했습니다.",{diag:"energyDevices"}],
  ["반복되는 데이터는 하나의 카드 규칙으로","",{list:[
   ["Variable","Primitive → Semantic Token","색상 · 간격 · 라운드 · 글자 크기를 Figma 베리어블로 정의하고, 원시 값과 의미 토큰 두 단계로 나눠 화면에는 의미 토큰만 적용했습니다. 기준을 바꾸면 모든 화면에 한 번에 반영됩니다."],
   ["Component","Data → Card Module","수치 · 단위 · 라벨 · 증감 같은 작은 Data 컴포넌트를 먼저 만들고, 이를 조합해 KPI · 수익 · 정보 카드 모듈을 정의했습니다. 데이터가 늘어나도 같은 규칙으로 카드를 확장합니다."]]}]],
 screens:[{devices:"대시보드",items:[["Mobile","energy-f-dash-mo",780,4324,390],["Tablet","energy-f-dash-tb",1668,2742,834],["PC","energy-f-dash-pc",1760,1667,1440]]},
  {devices:"발전량",items:[["Mobile","energy-f-power-mo",780,5362,390],["Tablet","energy-f-power-tb",1668,4616,834],["PC","energy-f-power-pc",1760,1748,1440]]}],
 result:"첫 화면에서 핵심 지표를 바로 판단하는 대시보드 구조와, 반복 데이터를 하나의 카드 규칙으로 표현하는 기준(Primitive → Semantic 토큰, Data → Card 모듈)을 남겼습니다. 화면마다 따로 그리던 데이터 표현이 하나의 규칙으로 정리되어, 데이터 항목이 늘어도 같은 카드로 확장하고 PC · 태블릿 · 모바일에 같은 기준을 적용할 수 있게 되었습니다. 화면을 그리기 전에 '사용자가 무엇을 가장 먼저 판단해야 하는가'를 정하는 것이 대시보드 설계의 출발점이라는 것을 다시 확인한 프로젝트입니다."},
{id:"counselling", name:"Counselling Service", desc:"B2B 화상 상담에서 B2C 심리상담 앱까지", cat:"Healthcare", year:"2022–2023", type:"Web · App",
 lead:"운영된 B2B 상담 서비스를 바탕으로, B2C 심리상담 앱을 다시 설계하다",
 stages:[
  ["reil (B2B)",[["기간","2022.04 · 8주"],["플랫폼","PC Web · 화상 상담(PC/Mobile)"],["역할","웹 서브 페이지, 화상 상담 화면 UI (기여도 80%)"],["팀","기획·개발 협업"],["툴","Adobe XD"],["상태","운영"]]],
  ["Good Listener (B2C)",[["기간","2023.02–03 · 2주"],["플랫폼","Mobile App · 상담사 Web"],["역할","User Flow, Mobile UI, 화상 상담 UI (기여도 100%)"],["팀","기획 2 · 프론트엔드 1 · UI 1"],["툴","Adobe XD"],["상태","컨셉 제안"]]]],
 overview:"의사 커뮤니티 플랫폼 안에서 운영된 정신건강 상담 서비스 reil과, 이를 일반 사용자 대상의 독립 서비스로 분리한 Good Listener의 UI를 설계했습니다. reil은 하나의 웹 안에서 상담사와 내담자의 화면을 나눴고, Good Listener는 상담사에게는 web을, 내담자에게는 app을 제공하는 구조로 다시 설계했습니다.",
 problem:"한 서비스 안에 상담사와 내담자, 실시간 상담과 쪽지 상담, 영상·음성·채팅이라는 서로 다른 조건이 겹쳐 있었습니다. 같은 기능이라도 누가, 어떤 상담 방식으로 쓰는지에 따라 필요한 정보가 달랐습니다.",
 decisions:[
  ["@Part 1. reil (B2B)"],
  ["상담 유형마다 신청 흐름을 다르게","실시간 상담과 쪽지 상담을 유형별로 다르게 신청하도록 하고, 상담 동의 → 문진 작성 → 예약 완료로 단계를 나눴습니다. 상담사마다 다른 문진에 맞춰 질문별 답변 서식(예/아니요, 추가 설명 입력, 필수 항목 오류 표시)을 정의했습니다.","신청 단계 화면",SL("free",[["상담 동의","counselling-d1-1","동의"],["문진 작성","counselling-d1-2","문진"],["예약 완료","counselling-d1-3","완료"]])],
  ["같은 상담, 사용자에 따라 다른 화면","상담 관리와 화상 상담 화면을 계정 권한에 따라 다르게 구성했습니다. 내담자에게는 예약한 상담과 영상 · 채팅만 보여 주고, 상담사에게는 내담자 노트 · 상담 일지 · 상담 내용 기록 · 채팅을 한 화면에 모아 상담하면서 바로 기록할 수 있게 했습니다.",{groups:[{group:"상담 관리",label:"상담 관리",tabs:1,items:[["내담자","counselling-d2-client",1680,2604],["상담사","counselling-d2-counselor",1680,2153]]},{group:"화상 상담",label:"화상 상담",tabs:1,items:[["내담자","counselling-d2-client-call",1920,1049],["상담사","counselling-d2-counselor-call",1920,1077]]}]}],
  ["상담 방식마다 가장 중요한 것을 크게","화상 상담 화면은 상담 방식에 따라 중심 요소를 바꿨습니다. 영상 상담은 상대 영상을 가장 크게, 음성 상담은 영상 영역을 줄이고 말하는 사람에게 포커스를, 채팅 상담은 채팅 영역을 가장 크게 두었습니다. 전체 화면에서는 영상만 남깁니다.","상담 방식별 화면",SL("wide",[["영상","counselling-d3-video","영상"],["음성","counselling-d3-voice","음성"],["채팅","counselling-d3-chat","채팅"],["전체 화면","counselling-d3-full","전체"]])],   /* 영상 · 음성 · 채팅은 강조 영역 밖을 어둡게(스포트라이트, 이미지에 합성) · 전체 화면은 원본 */
  ["예외 상황을 먼저 화면으로","모바일 화상 상담에서 생길 수 있는 상황 — 양쪽 카메라 off, 마이크 · 카메라 off, 채팅 수신, 상담사 대기 — 을 각각 화면으로 정의해, 어떤 상태에서도 지금 무슨 일이 일어나는지 알 수 있게 했습니다.","모바일 예외 화면",SL("phone",[["카메라 off","counselling-d4-camoff","카메라"],["마이크 · 카메라 off","counselling-d4-micoff","마이크"],["채팅","counselling-d4-chat","채팅"],["대기","counselling-d4-wait","대기"]])],
  ["@Part 2. Good Listener (B2C)"],
  ["상담사에게는 넓은 web 화면","상담사는 여러 내담자의 예약과 기록을 동시에 다루기 때문에 web으로 제공했습니다. 예약 관리는 일정 · 채팅 · 상담 내역을 3단으로 나란히 두고, 화상 통화방에서는 내담자의 사전 질문 답변을 옆에 띄운 채 상담하도록 했습니다.","상담사 web",SL("wide",[["와이어프레임","counselling-d5-wire","와이어"],["예약 관리","counselling-d5-reserve","예약"],["화상 통화방","counselling-d5-call","통화"]])],
  ["내담자에게는 상담에만 집중하는 화상 화면","내담자 app의 화상 화면은 상대 영상으로 화면 전체를 채우고, 컨트롤은 화면을 누를 때만 하단에 보이게 했습니다. 새 메시지는 화면을 가리지 않는 토스트로만 알립니다.",{group:"내담자 app 화상",items:[["진행 중","counselling-d6-call",780,1601,390],["전체 화면","counselling-d6-full",780,1601,390]]}],
  ["가볍게 둘러보고, 고르는 근거는 충분히","온보딩부터 메인 · 상담사 프로필 · 상담 일정 · 쪽지 상담까지 내담자 app의 주요 화면을 설계했습니다. 메인에서는 추천 상담사를 사진과 소개 한마디, 최소한의 평점으로 가볍게 보여 주고, 프로필에서 경력 · 자격으로 판단 근거를 제공했습니다. 실시간 상담이 부담스러운 사용자는 메인에서 바로 쪽지 상담을 시작할 수 있습니다.",{diag:"csAppList"}]],
 screens:null,   /* D 섹션에 화면이 모두 있어 Final Screens 없음 */
 result:"reil은 실제 서비스에 적용되어 운영되었고, Good Listener는 컨셉 단계에서 메인 시안 2종, 대표 페이지 3종의 hi-fi 디자인, 디자인 가이드까지 제안했습니다. 같은 경험을 다른 사용자에게 옮길 때, 기능을 그대로 가져오기보다 역할에 맞게 다시 고르는 과정이 필요했습니다. 상담사에게는 기록과 관리가, 내담자에게는 상담 자체가 중심이라는 판단이 최종 UI 화면에 반영된 프로젝트입니다."},
{id:"groupbuying", name:"Group Buying", desc:"주문부터 취소·반품까지 설계한 공동구매 커머스", cat:"Commerce", year:"2022", type:"Web",
 lead:"의사 회원이 포인트로 생활용품을 구매하는 공동구매, 주문 이후까지 설계하다",
 info:[["기간","2022.05"],["플랫폼","PC Web"],["역할","PC UI 디자인, 주간 이벤트 페이지 디자인 (모바일 UI는 다른 디자이너 담당)"],["팀","디자인팀 협업"],["툴","Adobe XD"],["상태","운영"]],
 overview:"의사 커뮤니티 플랫폼에 새로 도입된 결제 기능, 공동구매의 PC 화면을 설계했습니다. 생활용품·가전·상품권을 회원 포인트와 함께 구매하는 서비스로, 상품 목록부터 주문·결제, 마이페이지의 주문 관리와 알림 메일까지가 범위였습니다.",
 problem:"결제가 처음 도입되는 서비스라, 결제 완료 이후에 생기는 상황 — 배송 중, 배송 완료, 배송지 변경, 취소·교환·반품 — 을 사용자가 스스로 처리할 수 있는 화면이 함께 필요했습니다.",
 decisions:[
  ["구매 흐름을 끊지 않게","상품 상세에서 바로 주문 · 결제 레이어를 열어 페이지 이동 없이 결제하고, 결제한 주문은 마이페이지의 주문 상세에서 결제 금액과 배송 정보까지 한 번에 확인하게 했습니다.","상세 → 주문/결제 → 마이페이지",SL("wide",[["상품 상세","groupbuying-d1-detail","상세"],["주문 · 결제","groupbuying-d1-pay","결제"],["마이페이지","groupbuying-d1-mypage","마이"]])],
  ["선택 전과 후, 길어질 때까지","옵션을 고르기 전에는 구매 버튼을 비활성화하고, 옵션을 여러 개 담거나 상품명이 두 줄을 넘는 경우의 줄바꿈 규칙을 정해 개발에 전달했습니다.","옵션 선택 전 · 후",SL("wide",[["선택 전","groupbuying-d2-before","전"],["선택 후","groupbuying-d2-after","후"]])],
  ["예외 상태까지 화면으로","결제 이후 취소 · 교환 · 반품 요청 창은 기본, 요청 내역 없음, 내용이 많을 때 최대 높이(스크롤) 상태를 각각 설계해, 어떤 경우에도 레이아웃이 깨지지 않게 했습니다.","요청 창 상태별 화면",SL("wide",[["기본","groupbuying-d3-default","기본"],["내역 없음","groupbuying-d3-empty","없음"],["최대 높이","groupbuying-d3-max","최대"]])],
  ["주문 이후의 소식은 메일로","주문 접수 · 상품 발송 · 취소 완료 시점마다 같은 구조의 알림 메일을 보내, 주문 번호와 상품 · 배송 정보를 메일에서 바로 확인하게 했습니다.","Push 이메일",SL("free",[["주문 내역","groupbuying-d4-order","주문"],["상품 발송","groupbuying-d4-ship","발송"],["취소 완료","groupbuying-d4-cancel","취소"]])],
  ["출시 이후의 운영까지","공동구매를 알리는 'Thursday Market' 타임딜 이벤트를 회차마다 디자인했습니다. 로고타입과 페이지 구조는 고정하고 회차별 테마만 바꿔, 매번 새롭지만 같은 서비스로 보이게 했습니다.",{src:"groupbuying-d5",w:1760,h:1100,alt:"Thursday Market 대표 회차"},null,["c10","Thursday Market 전체 회차 보기"]]],
 screens:null,   /* D 섹션에 화면이 모두 있어 Final Screens 없음 */
 result:"공동구매는 실제 서비스에 적용되어 운영되었고, 플랫폼에 처음 도입된 결제 프로세스의 UI 기준을 남겼습니다. 주문 · 결제 레이어, 요청 창의 상태별 화면, 같은 구조의 알림 메일까지 정의했습니다. 결제가 들어간 서비스인 만큼 메인 화면 외에도 예외 상태의 화면을 중요하게 다룬 프로젝트입니다."},
{id:"lesson365", name:"Lesson 365", desc:"강의 중에도 길을 잃지 않도록 개선한 화상교육 플랫폼", cat:"Education", year:"2021", type:"Web",
 lead:"기존 화상교육 서비스를 분석해, 강의 중에도 길을 잃지 않는 화면으로 개선하다",
 info:[["기간","2021.05–07"],["플랫폼","PC Web"],["역할","기존 서비스 분석, 레퍼런스 수집, UX/UI 개선, 화면 디자인 (기여도 70%)"],["팀","사내 연구과제 팀"],["툴","Adobe XD · Illustrator"],["상태","디자인 전달 후 개발 진행"]],
 overview:"비대면 강의를 위한 웹 기반 화상교육·회의 플랫폼의 2.0 개선 작업입니다. 서비스의 톤앤매너는 유지하면서, 기능 구성과 화면 전반을 다시 설계했습니다.",
 problem:"영역이 흩어져 있고 메뉴 그룹 기준이 모호했습니다. 토글과 호버 뒤에 숨겨진 메뉴가 많아 사용성이 떨어졌고, 아이콘도 직관적이지 않았습니다. 화상 화면은 인원이 늘 때마다 그리드가 실시간으로 분할·재배치되어 레이아웃을 정할 수 없었고, 강사·발표자·학습자의 구분도 불분명했습니다.",

  ["시선 흐름대로 메뉴를 고정","헤더와 하단 메뉴를 없애고, 기능과 비중이 비슷한 메뉴끼리 묶어 고정했습니다. 사용자의 시선이 움직이는 순서(상단 → 우측)에 따라 상단에는 타이틀과 마이크 · 카메라 같은 주요 컨트롤, 화면 분할 · 참석자 · 채팅을 두고, 우측에는 화면 공유 · 화이트보드 · 자료실 같은 기능 메뉴를 세로로 고정했습니다.",{diag:"l365Layout"}],
  ["그리드는 사용자가 정하게","접속 인원에 따라 바뀌던 그리드 대신 그리드 우선 지정 방식을 제안해 렌더링 부담을 줄이고, 학습 · 회의 · 토의 상황에 맞게 격자형과 발표형 중 고를 수 있게 했습니다. 권한에 따라 아이콘을 구분해 혼란을 줄였습니다.",{diag:"l365Grid"}],
  ["화이트보드는 여러 개, 생성은 정해진 사람만","한 개만 만들 수 있던 화이트보드를 여러 개 만들 수 있게 하고, 실시간 화면을 썸네일로 반영해 목록에서 바로 고를 수 있게 했습니다. 모두에게 생성 권한을 주면 혼란이 생길 수 있어 지정된 사용자에게만 권한을 주고, 비활성화된 도구는 불투명도로 구분했습니다. 파일을 올리면 화이트보드에 추가되고, 여러 파일을 함께 올릴 수 있습니다.",{diag:"l365Board"}]],

 result:"기존에 운영중이던 화상채팅 서비스를 레퍼런스 분석, As-is와 To-be 정의를 거쳐 UI 화면까지 진행했습니다. 새로운 기능을 추가하기보다 기존의 것이 '왜 불편한지'를 정리하는데 초점을 두고 개선 사항을 정리했습니다. 모든 개선안을 As-is와 To-be 형식으로 정리해, 디자인 결정의 근거로 삼았습니다. 시안뿐만 아니라 문서까지 더해 이해관계자들을 설득한 프로젝트입니다."},

{id:"jibsarang", name:"Jibsarang", desc:"가구 구성원과 함께 관리하는 집안일 앱", cat:"Lifestyle", year:"2026", type:"App",
 lead:"반복되는 집안일을 가구 단위로 정리하고 함께 관리하는 앱",
 info:[["기간","2026"],["플랫폼","iOS Mobile App"],["역할","IA, User Flow, 컨셉, UI 디자인, 디자인 시스템"],["팀","개인 프로젝트"],["툴","Figma"],["상태","진행 중"]],

 hyp:[["\"오늘 뭘 해야 하는지부터 생각하면 막막해요\"","매일 해야 하는 일을 먼저 알려주면 어떨까?","No Thinking — 오늘 할 일을 먼저 제안"],["\"못 한 일이 쌓이면 죄책감이 들고 초조해요\"","어쩔 수 없는 사정으로 못 한 것이라면?","No Guilt · No Pressure — 조용한 UX, 알림 최소화"],["\"집안일을 끝내도 성취감은 없고 남은 일만 보여요\"","작더라도 성취감을 느낄 수 있다면?","Just Enough — 작은 완료에도 즉시 피드백"]],

 decisions:[
  ["맞춤 설정부터 요약까지, 끊기지 않는 흐름","처음 시작할 때 집안일 유형을 고르면 그에 맞는 할 일을 추천합니다. 집안일은 이름 · 반복 주기(수시 · 매일 · 주기 · 정기) · 알림을 한 화면에서 추가하고, 목록은 날짜별 · 주기별로 확인합니다. 한 주 동안 한 일은 요약 탭의 캘린더와 그래프로 돌아볼 수 있습니다.","User Flow",SL("phone",[["맞춤 설정","jibsarang-d1-1","설정"],["집안일 추가","jibsarang-d1-2","추가"],["집안일 목록","jibsarang-d1-3","목록"],["요약","jibsarang-d1-4","요약"]])],
  ["혼자 살아도, 함께 살아도","가구를 새로 만들거나 이미 있는 가구에 참여해 구성원과 집안일을 나눕니다. 가구 탭에서는 받은 요청을 바로 수락하거나 거절하고, 구성원이 완료한 일은 별도 채팅 없이 피드로 확인합니다. 요청처럼 꼭 필요한 일만 알림으로 알려 놓치지 않게 했습니다.","가구 설정 · 피드 · 알림",SL("phone",[["가구 설정","jibsarang-d2-1","가구"],["가구 피드 · 요청","jibsarang-d2-2","피드"],["요청 알림","jibsarang-d2-3","알림"]])],
  ["낮에도 밤에도","기기 설정에 맞춰 라이트·다크 테마가 전환되도록 디자인 시스템을 구성했습니다.","다크 테마",SL("phone",[["오늘","jibsarang-d3-today","오늘"],["집안일 추가","jibsarang-d3-add","추가"],["요약","jibsarang-d3-report","요약"]])]],
 screens:null,   /* D 섹션에 화면이 모두 있어 Final Screens 없음 */
 result:"현재 진행 중인 프로젝트로, No Thinking · No Guilt · Just Enough 세 원칙을 기준으로 와이어프레임부터 라이트 · 다크 디자인 시스템까지 혼자 설계했습니다. 맞춤 설정 → 집안일 추가 → 목록 → 요약으로 이어지는 핵심 흐름과 가구 단위로 함께 쓰는 화면을 hi-fi로 정리했습니다."}

const SRC=id=>/\.\w+$/.test(id)?id:id+".webp";
const IMG=id=>`<img src="img/${SRC(id)}" alt="" loading="lazy" decoding="async">`;
/* ===== 대표 이미지 =====
   Works · 메인 외 모달 히어로: 기본 배경(thumb-bg-v1~v4.webp, 무작위) + UI 레이어(투명)
     <id>-ui.webp (2560×1440) · Works 작은 카드(PC 1:1)는 <id>-ui-sq.webp (1440×1440)
   Home 메인 4개 · 그 모달 히어로: 개별 배경이 합쳐진 한 장 <id>-main.webp (2560×1440)
   파일이 들어오면 아래 목록에 id만 추가. UI가 없으면 배경만 보임. */
const HOME_MAIN=new Set(HOME_IDS);   /* 홈 대표 4개 = 히어로도 <id>-main.webp */
const UI_LAYER=new Set(["energy","counselling","payappcafe","jibsarang","cme","groupbuying","edi","botami","lesson365","bookorbit"]);
const UI_SQ=new Set(["payappcafe","jibsarang","cme","groupbuying","botami","lesson365","bookorbit"]);   /* PC 작은 카드(1:1)용 정사각 레이어 — ORDER에서 큰 카드(1)인 Energy · Counselling · EDI는 쓰지 않음 */
/* 기본 배경 4종(thumb-bg-v1~v4.webp)을 페이지를 열 때마다 무작위 배치. Works 순서에서 바로 앞 프로젝트와 같은 배경은 피함.
   같은 프로젝트는 카드 · 모달 히어로가 같은 배경. 고정하고 싶으면 BG_PICK에 {id: 번호}. */
const BG_PICK={};
let BG_MAP=null;   /* 처음 그릴 때 한 번 정함 (ORDER가 아래에 선언되어 지연 계산) */
const BG_OF=id=>{if(!BG_MAP){BG_MAP={};let prev=0;ORDER.forEach(([,k])=>{let v=BG_PICK[k];if(!v){const c=[1,2,3,4].filter(x=>x!==prev);v=c[Math.floor(Math.random()*c.length)]}BG_MAP[k]=v;prev=v})}return BG_MAP[id]||1};
const tlBg=id=>`<img class="tl-bg" src="img/thumb-bg-v${BG_OF(id)}.webp" alt="" loading="lazy" decoding="async">`;
const tlUi=(id,sq)=>{const ui=UI_LAYER.has(id)?`<img class="tl-ui" src="img/${id}-ui.webp" alt="" loading="lazy" decoding="async">`:"";
 return sq&&UI_SQ.has(id)?`<picture class="tl-ui-p"><source media="(min-width:768px)" srcset="img/${id}-ui-sq.webp">${ui||`<img class="tl-ui" src="img/${id}-ui-sq.webp" alt="" loading="lazy" decoding="async">`}</picture>`:ui};
const HERO_UI=new Set(["lesson365"]);   /* 모달 히어로만 다른 UI 레이어: img/<id>-hero-ui.webp (Works 카드는 기존 -ui 유지) */
const THUMB=(id,ctx)=>ctx==="hero"&&HERO_UI.has(id)?tlBg(id)+`<img class="tl-ui" src="img/${id}-hero-ui.webp" alt="" loading="lazy" decoding="async">`:(ctx==="home"||ctx==="hero")&&HOME_MAIN.has(id)?`<img class="tl-main" src="img/${id}-main.webp" alt="" loading="lazy" decoding="async">`:tlBg(id)+tlUi(id,ctx==="sq");   /* ctx: home · work · sq(Works 작은 카드) · hero */
const metaLine=p=>`${p.cat} · ${p.year} · ${p.type}`;  /* 모달 정보용 (연도 포함) */
const cardMeta=p=>`${p.cat} · ${p.type}`;               /* 썸네일용 (연도 없음) */
/* Works 그리드 순서 = 모달 이전/다음 순서. big = 큰 카드 */
const ORDER=[["p","energy",1],["p","payappcafe"],["p","jibsarang"],["p","counselling",1],["o","cme"],["p","groupbuying"],["o","edi",1],["o","botami"],["p","lesson365"],["o","bookorbit"]];

 else if(h==="home"||h==="about"){state.view=h;state.modal=null}
 else if(h==="work"){state.view="work";state.tab="ui";state.modal=null}
 else if(h==="content"){state.view="work";state.tab="content";state.modal=null}
 else if(findModal(h)){ state.modal=h;
   if(h.startsWith("hw")){state.view="about"}
   else if(h.startsWith("c")){state.view="work";state.tab="content"}
   else if(h.startsWith("o-")&&state.view==="home"){state.view="work";state.tab="ui"} }
 else {state.view="home";state.modal=null}
 render(); renderModal(); renderContact();
}
function go(view){state.view=view;state.modal=null;state.contact=false;if(view==="work")state.tab=state.tab||"ui";window.scrollTo(0,0);pushHash();render();renderModal();renderContact()}
function openModal(tok,trigger){lastFocus=trigger||document.activeElement;state.contact=false;renderContact();state.modal=tok;pushHash();renderModal()}
function swapModal(tok){state.modal=tok;history.replaceState(null,"","#"+tok);renderModal()}
function closeModal(){ if(!state.modal) return; state.modal=null; history.replaceState(null,"","#"+hashFor()); renderModal(); }
function toggleContact(force){ const on = force===undefined?!state.contact:force; if(on===state.contact) return;
 if(on){ state.modal=null; renderModal(); } state.contact=on; history.replaceState(null,"","#"+hashFor()); renderContact(); }

/* ---------- EVENTS ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-open],[data-tab],[data-swap],[data-copy],[data-resume],[data-jump],[data-contact]");
 if(!t) return;
 if(t.hasAttribute("data-contact")){e.preventDefault();toggleContact()}
 else if(t.dataset.go){e.preventDefault();go(t.dataset.go)}
 else if(t.dataset.open){e.preventDefault();openModal(t.dataset.open,t)}
 else if(t.dataset.tab){if(t.dataset.tab!==state.tab){state.tab=t.dataset.tab;tabSwitch=true;pushHash();render()}}
 else if(t.dataset.swap){e.preventDefault();swapModal(t.dataset.swap)}
 else if(t.dataset.jump){e.preventDefault();const el=document.getElementById(t.dataset.jump);if(el){spyMark(t.dataset.jump);spyLock=Date.now()+900;el.scrollIntoView({behavior:"smooth",block:"start"})}}
 else if(t.dataset.copy){const v=t.dataset.copy;
   const msg=v.includes("gmail")?"Gmail 주소가 복사되었습니다.":"Naver 메일 주소가 복사되었습니다.";
   navigator.clipboard?.writeText(v).then(()=>toast(msg),()=>toast(v)) ?? toast(v)}
 else if(t.dataset.resume==="down"){toast("이력서 PDF를 다운로드합니다")}   /* 링크 기본 동작(새 탭 · 다운로드)은 막지 않음 */
});
$("#mClose").onclick=closeModal;
$("#scrim").onclick=()=>{ if($("#modal").classList.contains("side")) closeModal(); };
$("#mPrev").onclick=()=>{const f=findModal(state.modal);if(f&&f.group&&f.i>0)swapModal(f.group[f.i-1])};
$("#mNext").onclick=()=>{const f=findModal(state.modal);if(f&&f.group&&f.i<f.group.length-1)swapModal(f.group[f.i+1])};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){ if(state.contact) toggleContact(false); else closeModal(); }});
$("#cscrim").onclick=()=>toggleContact(false);
window.addEventListener("hashchange",fromHash);

$("#mPrev").innerHTML=ICON.left; $("#mNext").innerHTML=ICON.right; $("#mClose").innerHTML=ICON.close;

/* notes */
$("#notesBtn").onclick=function(){const on=document.body.classList.toggle("show-notes");this.setAttribute("aria-pressed",on);this.textContent=on?"기획 주석 숨기기":"기획 주석 보기"};

fromHash();
</script>
</body>
</html>
