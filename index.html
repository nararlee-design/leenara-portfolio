<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lee Nara — UI Designer Portfolio</title>
<meta name="description" content="반응형 웹, 관리자 UI, 모바일 서비스, 대시보드를 설계해 온 UI 디자이너 이나라의 포트폴리오입니다.">
<meta name="robots" content="noindex, nofollow"><!-- 공개 전까지 검색 노출 차단 · 공개 시 삭제 -->
<meta name="theme-color" content="#111214">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap">
<style>
@font-face{font-family:"Pretendard Variable";src:url(fonts/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}

/* ===== Tokens (피그마 변수와 같은 이름) ===== */
:root{
  --bg-base:#111214; --bg-surface:#17181B; --bg-elevated:#1A1B1E; --bg-placeholder:#1E2024;
  --text-primary:#F4F5F6; --text-secondary:#C9CDD3; --text-tertiary:#9AA0AA; --text-disabled:#6E747E; --text-on-accent:#111214;
  --border-default:#2D3036; --border-strong:#F4F5F6; --border-dashed:#3A3E45;
  --accent:#4FD1C0; --accent-hover:#56DECC;
  --overlay-dim:rgba(5,6,7,.72); --overlay-bar:rgba(23,24,27,.92); --caption-start:rgba(17,18,20,.7744);
  --f-en:"Archivo", "Pretendard Variable", system-ui, sans-serif;
  --f-kr:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  --gutter:48px;   /* 좌우 여백 */
  --inset:20px;    /* 이미지 굴곡에 맞춘 글자 시작선 (48 + 20) */
  --hh:92px;       /* 헤더 높이 */
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
  /* 와이어프레임 화면용 별칭 (화면 시안 반영 전까지 유지) */
  --bg:var(--bg-base); --surface:var(--bg-surface); --fg:var(--text-primary); --muted:var(--text-tertiary);
  --line:var(--border-default); --ph:var(--bg-placeholder); --ph-line:var(--border-dashed); --scrim:var(--overlay-dim);
  --note:#fdba74; --note-bg:#3a2617; --r:4px;
}
@media (max-width:767px){:root{--gutter:16px;--inset:8px;--hh:68px}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg-base);color:var(--text-primary)}
html{scrollbar-gutter:stable}  /* 패널·모달로 스크롤을 잠가도 스크롤바 자리를 유지해 화면이 밀리지 않게 */
body{font-family:var(--f-kr);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.ico{display:block;flex:none}
.ico path{vector-effect:non-scaling-stroke}  /* 아이콘 선은 크기와 무관하게 1.2px */

/* ===== Header ===== */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg-base);transition:background .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg-base)}
body.contact-open::before{background:var(--bg-surface)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:var(--hh)}
.logo{font-family:var(--f-en);font-weight:800;font-size:20px;line-height:1;letter-spacing:.02em;color:var(--text-primary)}
nav.menu{display:flex;align-items:center;gap:20px}
.menu-item{display:inline-flex;align-items:center;height:44px;padding:14px 16px;border-radius:8px;font-family:var(--f-en);font-weight:600;font-size:16px;line-height:1;letter-spacing:.02em;color:var(--text-tertiary);transition:background .2s,color .2s}
.menu-item:hover{background:var(--bg-elevated)}
.menu-item[aria-current="page"]{background:var(--bg-elevated);color:var(--text-primary)}
@media (max-width:767px){
  .logo{font-size:17px}
  nav.menu{gap:4px}
  .menu-item{padding:14px 10px;font-size:15px}
}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:13px 20px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-elevated);font-family:var(--f-kr);font-weight:600;font-size:16px;line-height:1;color:var(--text-primary);text-decoration:none;white-space:nowrap;transition:background .2s}
.btn:hover{background:var(--bg-placeholder)}
.btn .lbl{padding:0 2px}
.btn .ico{width:16px;height:16px}
.btn .brand{width:16px;height:16px;border-radius:999px;background:var(--text-primary);color:var(--text-on-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn .brand svg{width:10px;height:10px}
.btn-cta{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:52px;padding:13px 32px;border-radius:999px;background:var(--accent);color:var(--text-on-accent);font-family:var(--f-en);font-weight:700;font-size:16px;line-height:1.6;text-decoration:none;white-space:nowrap;transition:background .2s}
.btn-cta:hover{background:var(--accent-hover)}
.btn-cta .lbl{padding-left:4px}
.btn-cta .ico{width:20px;height:20px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-elevated);color:var(--text-primary);transition:background .2s}
.icon-btn .ico{width:24px;height:24px}
.icon-btn:hover{background:var(--bg-placeholder)}
.icon-btn[disabled]{color:var(--text-disabled);cursor:default}
.icon-btn[disabled]:hover{background:var(--bg-elevated)}
.icon-btn.close{background:var(--text-primary);border-color:var(--text-primary);color:var(--text-on-accent)}
.icon-btn.close:hover{background:var(--text-primary)}  /* 닫기 버튼은 hover 변화 없음 */
/* 마이크로 인터랙션: 아이콘만 움직임 (마우스 기기 hover · 키보드 focus) */
.btn-cta .ico,.icon-btn.close .ico,.btn .mv-arw{transition:transform .2s var(--ease)}
.btn .ico{overflow:visible}
@media (hover:hover){
 .btn-cta:hover .ico{transform:translateX(2px)}
 .icon-btn.close:hover .ico{transform:rotate(90deg)}
 .btn[data-resume="view"]:hover .mv-arw{transform:translate(2px,-2px)}
 .btn[data-resume="down"]:hover .mv-arw{transform:translateY(2px)}
}
.btn-cta:focus-visible .ico{transform:translateX(2px)}
.icon-btn.close:focus-visible .ico{transform:rotate(90deg)}
.btn[data-resume="view"]:focus-visible .mv-arw{transform:translate(2px,-2px)}
.btn[data-resume="down"]:focus-visible .mv-arw{transform:translateY(2px)}
@media (prefers-reduced-motion:reduce){.btn-cta .ico,.icon-btn.close .ico,.btn .mv-arw{transition:none;transform:none!important}}

/* ===== Tag ===== */
.tag{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:8px 10px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-placeholder);font-family:var(--f-en);font-weight:700;font-size:12px;line-height:1;letter-spacing:.04em;color:var(--text-primary);white-space:nowrap;flex:none}

/* ===== Tabs ===== */
.tabbar{border-bottom:1px solid var(--border-default)}
.tabs{display:flex;gap:24px}
.tab{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:20px 0;border-bottom:2px solid transparent;font-family:var(--f-en);font-weight:700;font-size:18px;line-height:1;letter-spacing:.01em;color:var(--text-tertiary)}
.tab:hover{color:var(--text-primary)}
.tab[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--border-strong)}
/* 탭 밑줄 이동: JS가 밑줄 하나를 선택한 탭 아래로 옮김 (JS 없으면 위 테두리 그대로) */
.tabs{position:relative}
.tabs.has-ink .tab[aria-selected="true"]{border-bottom-color:transparent}
.tab-ink{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--border-strong);pointer-events:none;transition:transform .3s var(--ease),width .3s var(--ease)}
.tab-ink.no-anim{transition:none}
@media (prefers-reduced-motion:reduce){.tab-ink{transition:none}}

/* ===== Thumbnail cards ===== */
.card{position:relative;display:block;width:100%;text-align:left;cursor:pointer;color:inherit;text-decoration:none}
.thumb{position:relative;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);background:var(--bg-elevated)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.card:hover .thumb img,.card:focus-visible .thumb img{transform:scale(1.06)}
@media (prefers-reduced-motion:reduce){.thumb img{transition:none}.card:hover .thumb img,.card:focus-visible .thumb img{transform:none}}
/* home: 이미지 아래 캡션 · 클릭 영역은 썸네일만 */
.card-home{position:relative}
.card-home .thumb{display:block;width:100%;aspect-ratio:16/9;border-radius:20px;cursor:pointer}
.card-home .thumb:hover img,.card-home .thumb:focus-visible img{transform:scale(1.06)}
@media (prefers-reduced-motion:reduce){.card-home .thumb:hover img,.card-home .thumb:focus-visible img{transform:none}}
.card-home .cap{display:flex;align-items:baseline;gap:16px;padding:24px var(--inset) 0}
.card-home .nm{font-family:var(--f-en);font-weight:800;font-size:22px;line-height:1.2;color:var(--text-primary)}
.card-home .ds{font-size:14px;line-height:1.6;color:var(--text-secondary)}
@media (max-width:767px){
  .card-home .thumb{border-radius:12px}
  .card-home .cap{flex-direction:column;gap:2px;padding-top:14px}
  .card-home .nm{font-size:18px}
  .card-home .ds{font-size:14px}
}
/* full · half · content: 이미지 위 캡션 */
.card-grid .thumb{border-radius:4px;height:100%}
.card-grid .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;flex-direction:column;gap:8px;padding:40px 28px 24px;background:linear-gradient(0deg,var(--caption-start) 0%,rgba(17,18,20,0) 100%);pointer-events:none}
.card-grid .nm{font-family:var(--f-en);font-weight:800;font-size:24px;line-height:1.2;letter-spacing:.005em;color:var(--text-primary)}
.card-grid .mt{font-size:15px;line-height:1.5;color:var(--text-secondary)}
@media (max-width:767px){
  .card-grid .cap{padding:32px 16px 14px;gap:4px}
  .card-grid .nm{font-size:17px}
  .card-grid .mt{font-size:13px}
  .content-grid .card-grid .cap{padding:28px 12px 12px}
  .content-grid .card-grid .nm{font-size:14px}
  .content-grid .card-grid .mt{font-size:12px;line-height:1.4}
}


/* ===== Toast ===== */
#toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:80;transform:translate(-50%,20px);opacity:0;transition:opacity .25s,transform .25s;padding:12px 20px;border:1px solid var(--border-default);border-radius:999px;background:var(--bg-elevated);font-size:16px;line-height:1.6;color:var(--text-primary);white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Footer ===== */
footer.site .wrap{padding-top:80px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.copyright{margin:0;padding:0 var(--inset);font-family:var(--f-en);font-weight:400;font-size:24px;line-height:1.2;letter-spacing:-.02em;color:var(--text-tertiary)}
@media (max-width:767px){footer.site .wrap{padding-top:56px}.copyright{font-size:18px}}

/* ===== Contact (헤더 드롭 패널 · 홈 섹션 공통 블록) ===== */
.cscrim{position:fixed;inset:0;z-index:38;background:var(--overlay-dim);opacity:0;transition:opacity .25s}
.cscrim.on{opacity:1}
.cpanel{position:fixed;left:0;right:0;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:39;background:var(--bg-surface);border-radius:0 0 20px 20px;transform:translateY(calc(-100% - var(--hh)));transition:transform .45s var(--ease);max-height:calc(100% - var(--hh) - env(safe-area-inset-top,0px));overflow-y:auto}
.cpanel.open{transform:none}
body.contact-open header.site{background:var(--bg-surface)}
body.contact-open nav.menu [data-go]{display:none}
@media (prefers-reduced-motion:reduce){.cpanel,.cscrim{transition:none}}
.contact-box{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;padding-block:80px 60px}
.contact-title{margin:0;font-family:var(--f-en);font-weight:800;font-size:100px;line-height:.92;line-height:round(.92em,1px);letter-spacing:-.02em;color:var(--text-primary)}
.contacts{display:flex;justify-content:flex-end;align-items:flex-start;gap:48px;flex-wrap:wrap}
.cgroup{display:flex;flex-direction:column;gap:16px}
.cgroup .txt{display:flex;flex-direction:column;gap:8px}
.cgroup h3{margin:0;font-family:var(--f-en);font-weight:800;font-size:20px;line-height:1.2;color:var(--text-secondary)}
.cgroup p{margin:0;font-size:14px;line-height:1.65;color:var(--text-tertiary)}
.cgroup .row{display:flex;gap:12px;flex-wrap:wrap}
.contact-msg{margin:0 0 40px;font-size:18px;line-height:1.6;color:var(--text-secondary)}
@media (max-width:1023px){.contact-box{flex-direction:column;align-items:flex-start}.contacts{justify-content:flex-start}}
@media (max-width:767px){
  .contact-box{gap:32px;padding-block:40px 32px}
  .contact-title{font-size:56px}
  .contacts{flex-direction:column;gap:28px}
}

/* ===== Modal ===== */
.scrim{position:fixed;inset:0;z-index:50;background:var(--overlay-dim);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
/* Full: 위·좌·우 24 · 아래 붙음 / Side: 위·좌우 24 · 아래 16 · 폭 640 — 오른쪽 라인 고정, 전환 시 왼쪽 끝만 움직임 */
.modal{position:fixed;z-index:55;background:var(--bg-surface);display:flex;flex-direction:column;overflow:hidden;border-radius:20px;
  top:calc(24px + env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));
  --sw:min(640px,calc(100vw - 48px));
  transition:left .5s cubic-bezier(.65,0,.25,1),bottom .5s cubic-bezier(.65,0,.25,1),border-radius .5s,transform .42s var(--ease)}
.modal.full{left:max(24px,env(safe-area-inset-left,0px));bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;transform:translateX(calc(100% + 32px))}
.modal.side{left:calc(100% - max(24px,env(safe-area-inset-right,0px)) - var(--sw));bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(calc(100% + 32px))}
.modal.open{transform:none}
/* 모바일: 모달 한 가지(Side 형태) · 사방 8 · 안에서 스크롤 */
@media (max-width:767px){.modal.side,.modal.full{top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:16px}}
@media (prefers-reduced-motion:reduce){.modal,.scrim,.m-body{transition:none}}
.m-bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 24px;background:var(--overlay-bar);flex:none}
.m-ttl{display:flex;align-items:center;gap:12px;min-width:0}
.m-ttl h2{margin:0;font-family:var(--f-kr);font-weight:800;font-size:22px;line-height:32px;letter-spacing:-.03em;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Content 모달: 한글 제목이라 한 단계 낮춤 */
.modal.is-content .m-ttl h2{font-weight:700}
@media (min-width:768px){.modal.is-content .m-ttl h2{font-size:20px;line-height:28px}}
.m-btns{display:flex;align-items:center;gap:12px;flex:none}
@media (max-width:767px){
  .m-bar{padding:8px 8px 8px 16px;gap:12px}
  .m-ttl{gap:8px}.m-ttl h2{font-size:17px;line-height:24px}
  .m-btns{gap:6px}
}
.m-body{flex:1;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain;transition:opacity .18s}
.m-body.swap{opacity:0}
.m-inner{padding:24px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:768px){.m-inner{padding:36px 40px 60px}.modal.side .m-inner{padding:8px 24px 60px}
 /* Side 모달: 카피(타이틀+캡션) 아래 → 이미지 16 */
 .modal.side .mv.ct{gap:16px}
 .modal.side .mh-title:not(:last-child){margin-bottom:-16px}}

/* ===== 아래는 와이어프레임 화면 스타일 (화면 시안 반영 전 임시, 다크 토큰만 적용) ===== */
.notes-toggle{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;font-family:var(--f-mono);font-size:12px;padding:8px 12px;border-radius:999px;border:1px solid var(--note);color:var(--note);background:var(--note-bg)}
.note{display:none;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;color:var(--note);background:var(--note-bg);border:1px dashed var(--note);border-radius:4px;padding:6px 8px;margin-block:8px}
body.show-notes .note{display:block}
.note-chip{display:none;position:absolute;top:10px;left:10px;z-index:2;font-family:var(--f-mono);font-size:11px;padding:3px 7px;border-radius:3px;background:var(--note-bg);color:var(--note);border:1px dashed var(--note)}
body.show-notes .note-chip{display:inline-block}
.ph{position:relative;background:var(--bg-placeholder);border:1px dashed var(--border-dashed);border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-disabled)}
.ph span{font-size:13px;padding:4px 8px;max-width:85%;text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;padding:0;list-style:none}
.tags li{font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.textlink{font-weight:500;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.textlink:hover{color:var(--accent)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-block:24px 20px;border-top:1px solid var(--line)}
.sec-head h2{font-family:var(--f-en);font-weight:800;font-size:28px;margin:0}
/* ===== Home ===== */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Hero: 배경 큰 이름(장식) + 소개 문구 · 키워드 */
/* 히어로: 배경 LEE NARA 크기(--gfs)에 카피 위치를 연동 → 모든 폭에서 시안처럼 배경 글자 아래쪽이 카피 첫 줄과 겹침 */
.hero{--gfs:clamp(64px,15.28vw,220px);--gfs:clamp(64px,round(down,15.28vw,1px),220px);--gtop:36px;position:relative;padding-top:calc(var(--gtop) + var(--gfs) * .636);padding-top:round(calc(var(--gtop) + var(--gfs) * .636),1px);padding-bottom:40px}
.hero-ghost{position:absolute;left:max(var(--gutter),env(safe-area-inset-left,0px));top:var(--gtop);margin:0;font-family:var(--f-en);font-weight:900;font-size:var(--gfs);line-height:.9;line-height:round(.9em,1px);letter-spacing:-.02em;color:rgba(255,255,255,.03);white-space:nowrap;pointer-events:none;user-select:none}
.hero-copy{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:24px;padding:0 var(--inset)}
@media (min-width:1200px){.hero-copy{flex-direction:row;justify-content:space-between;align-items:flex-start;gap:40px}}
.hero-copy p{margin:0;font-weight:700;font-size:24px;line-height:1.6;letter-spacing:-.03em;color:var(--text-primary)}
.keywords{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 20px;margin:0;padding:0;list-style:none;flex:none}

/* 단계 슬라이더 (Design Decisions 이미지 자리): 1:1 패널 안에서 앱 화면을 한 장씩 · 아래 단계 라벨 + 화살표 · 모바일은 스와이프 */
.slider{display:flex;flex-direction:column;gap:12px}
.sl-view{position:relative;aspect-ratio:1/1;max-height:560px;border-radius:16px;background:var(--bg-elevated);overflow:hidden}
.sl-track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none}
.sl-track::-webkit-scrollbar{display:none}
.sl-track:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:16px}
.sl-slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always}
/* 슬라이드 이미지 형태 3종: phone(앱 화면 · 기본) / wide(PC 화면 · 16:10 패널) / free(카드뉴스 · 포스터 · 인포그래픽 · 원본 비율, 패널 높이가 현재 장에 맞춰짐) */
.slider[data-frame="wide"] .sl-view{aspect-ratio:16/10;max-height:none}
.sl-shot{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.sl-shot>img{display:block;width:100%;height:100%;object-fit:contain}
.sl-shot .ph{width:100%;height:100%;border:0;border-radius:0}
.slider[data-frame="free"] .sl-view{aspect-ratio:auto;max-height:none;background:none;transition:height .3s var(--ease)}
.slider[data-frame="free"] .sl-track{align-items:flex-start}
.slider[data-frame="free"] .sl-slide{height:auto;align-items:flex-start}
.sl-free{width:100%}
.sl-free>img{display:block;width:100%;height:auto;border-radius:16px}
.sl-free .ph{width:100%;border-radius:16px}
.slider[data-frame="free"]{flex-direction:column-reverse}   /* 세로로 긴 원본: 단계 탭을 이미지 위에 */
@media (prefers-reduced-motion:reduce){.slider[data-frame="free"] .sl-view{transition:none}}
.sl-phone{position:relative;height:88%;aspect-ratio:1170/2532;border-radius:20px;overflow:hidden;background:var(--bg-placeholder)}   /* 앱 화면 캡처 원본 비율 (iPhone 1170×2532) */
.sl-phone>img{display:block;width:100%;height:100%;object-fit:cover}
.sl-phone .ph{width:100%;height:100%;border-radius:20px}
.sl-ctl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sl-steps{display:flex;flex-wrap:nowrap;gap:16px;min-width:0;overflow:hidden}   /* 한 줄 고정 · 넘치면 compact */
.sl-step{display:inline-flex;align-items:baseline;gap:6px;min-width:0;padding:6px 0;font-size:14px;font-weight:600;line-height:1.4;color:var(--text-tertiary);white-space:nowrap;transition:color .2s}
.sl-step span{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 단계 탭: 폭은 라벨로 고정, 상태는 on/off(색)만 → 넘겨도 위치가 움직이지 않음 */
.sl-step{flex:none}
.sl-step .sh{display:none}
/* compact: 한 줄에 다 안 들어가면 모든 단계를 짧은 이름으로 (1 추가 · 2 입력 · 3 설정) */
.slider.compact .sl-step .fl{display:none}
.slider.compact .sl-step .sh{display:inline}
/* nums: 짧은 이름도 넘치면 번호만 (같은 폭 32) · 이름 없는 단계(카드뉴스 등)는 항상 번호만 */
.slider.nums .sl-step span{display:none}
.slider.nums .sl-step,.sl-step.num{min-width:32px;justify-content:center}
.slider.nums .sl-steps{gap:0}
/* count: 번호도 한 줄에 다 안 들어가면(장 수가 많을 때) 단계 탭 대신 "3 / 11" */
.sl-count{display:none;font-family:var(--f-en);font-size:14px;font-weight:600;line-height:1.4;color:var(--text-tertiary);font-variant-numeric:tabular-nums;white-space:nowrap}
.sl-count b{color:var(--accent);font-weight:700}
.slider.count .sl-steps{display:none}
.slider.count .sl-count{display:block}
.sl-step b{font-family:var(--f-en);font-weight:700;font-size:12px}
.sl-step:hover{color:var(--text-primary)}
.sl-step[aria-current="step"]{color:var(--text-primary)}
.sl-step[aria-current="step"] b{color:var(--accent)}
.sl-arrows{display:flex;gap:8px;flex:none}
.sl-arrows .icon-btn{width:36px;height:36px}
.sl-arrows .icon-btn .ico{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){.sl-track{scroll-behavior:auto}.sl-step{transition:none}}
@media (max-width:767px){.sl-view{aspect-ratio:3/4}}
/* 터치 기기: 누르는 영역 44 (번호 칩 최소 폭 32 · 화살표는 모달 상단 버튼과 같은 44) */
@media (pointer:coarse){
 .sl-step{min-height:44px;align-items:center;justify-content:center}
 .sl-arrows .icon-btn{width:44px;height:44px}
 .sl-arrows .icon-btn .ico{width:24px;height:24px}
}   /* 모바일: 폰 화면이 너무 작아지지 않게 세로로 긴 패널 */
.fig img{display:block;width:100%;height:auto;border-radius:16px}       /* 폭만 맞추고 원본 비율 */
/* 이미지 스켈레톤: 받는 동안 bg-elevated ↔ bg-placeholder로 은은하게 깜빡임 → 준비되면 효과 없이 한 번에 표시 */
@keyframes skPulse{0%,100%{background-color:var(--bg-elevated)}50%{background-color:var(--bg-placeholder)}}
.sk,.sk-err{background-color:var(--bg-elevated)}
.sk{animation:skPulse 1.6s ease-in-out infinite}
.sk>img,.sk-err>img{visibility:hidden}
.fig{position:relative}
.fig.sk,.fig.sk-err{border-radius:16px}
.fig.noratio{aspect-ratio:16/9}                                     /* 크기 정보 없는 원본 비율 이미지: 받기 전 16:9 자리 */
.fig.noratio>img{position:absolute;inset:0;height:100%}
.sk-err::before{content:"이미지를 불러오지 못했습니다";position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-disabled);pointer-events:none}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.fig .ph{aspect-ratio:16/9;width:100%;border-radius:16px}
.imgs{display:flex;flex-direction:column;gap:12px}
.blist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.blist li{display:flex;gap:4px;font-size:16px;line-height:1.6;color:var(--text-primary)}
.blist li::before{content:"";flex:none;width:3px;height:3px;margin:11.5px 4.5px 0;border-radius:50%;background:var(--text-tertiary)}
.ttable{width:100%;min-width:0;border-collapse:collapse;font-size:16px}
.ttable th{padding:10px 12px;background:var(--bg-elevated);font-weight:600;font-size:14px;line-height:1.6;color:var(--text-tertiary);text-align:left;border:0}
.ttable td{padding:14px 12px;border:0;border-bottom:1px solid var(--border-default);line-height:1.6;color:var(--text-primary);vertical-align:top}
/* property-item */
.props{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:0}
.prop{display:flex;flex-direction:column;gap:4px;min-width:0}
.prop dt{font-family:var(--f-en);font-weight:700;font-size:13px;line-height:1.3;letter-spacing:.04em;color:var(--text-tertiary)}
.prop dd{margin:0;font-weight:600;font-size:14px;line-height:1.65;color:var(--text-primary)}
.stages{display:flex;flex-direction:column;gap:24px}
.stage-name{margin:0 0 12px;font-size:14px;font-weight:600;line-height:1.6;color:var(--text-tertiary)}
/* How I Work 카드 · Case 모달 다이어그램 */
.case-r{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.case-res{margin:0;font-weight:600;color:var(--text-primary)}
.case .btn .ico{width:20px;height:20px}
@media (hover:hover){.case .btn:hover .ico{transform:translateX(2px)}}
.case .btn .ico{transition:transform .2s var(--ease)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{position:relative;display:flex;flex-direction:column;gap:6px;padding:0 0 28px 28px}
.tl li::before{content:"";position:absolute;left:4px;top:7px;width:9px;height:9px;border-radius:50%;border:1.2px solid var(--text-tertiary);background:var(--bg-surface);box-sizing:border-box;z-index:1}
.tl li::after{content:"";position:absolute;left:8px;top:16px;bottom:-7px;width:1px;background:var(--border-default)}
.tl li:last-child{padding-bottom:0}.tl li:last-child::after{display:none}
.tl li.on::before{background:var(--accent);border-color:var(--accent)}
.tl-lb{font-size:14px;line-height:1.6;color:var(--text-tertiary)}
.tl-tx{font-size:16px;line-height:1.65;color:var(--text-secondary)}
.tl-tx strong{font-weight:700;color:var(--text-primary)}
.tl-s li.on .tl-tx{color:var(--accent)}   /* 다이어그램(Workflow)만 텍스트 강조 · Process 본문은 점만 강조 */
.tl-s li{padding-bottom:16px}
.tl-s .tl-tx{color:var(--text-primary)}
.lane .tl li:not(.on)::before{background:var(--bg-elevated)}
.kvs{display:flex;flex-direction:column;gap:32px}
.kv{display:flex;flex-direction:column;gap:20px}
.kv-h{margin:0 0 -8px;font-size:14px;font-weight:400;line-height:1.6;color:var(--text-tertiary)}
.kv-h.on{color:var(--accent)}
.kv-i{display:flex;flex-direction:column;gap:4px}   /* 항목 사이는 선 없이 간격 20 */
.kv-i b{font-size:16px;font-weight:700;line-height:1.5;color:var(--text-primary)}
.kv-i p{margin:0;font-size:15px;line-height:1.65;color:var(--text-secondary)}
.kv em,.lane em{font-style:normal}   /* 본문 텍스트 강조는 accent 없이 */
.lane{display:flex;flex-direction:column;padding:20px;border-radius:12px;background:var(--bg-elevated)}
.lane-h,.lane-r{display:grid;grid-template-columns:1fr 1px 1fr;column-gap:16px}
.lane-h{padding-bottom:12px;font-size:14px;font-weight:400;color:var(--text-tertiary)}
.lane-h span:last-child{text-align:left}
.lane-h span:first-child{text-align:right}
.lane-r i{background:var(--border-default)}
.lane-r>div{padding:8px 0;display:flex}
.lane-r>div:first-child{justify-content:flex-end}
.lane-c{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid var(--border-default);background:var(--bg-surface);font-size:15px;font-weight:600;line-height:1.5;color:var(--text-primary)}
.lane-c.on{border-color:var(--accent);color:var(--accent)}
.pipe{display:flex;flex-direction:column;align-items:center;gap:20px;padding:4px 0}
.pipe>.lane-c{position:relative}
.pipe>.lane-c:not(:last-child)::after{content:"";position:absolute;left:50%;top:calc(100% + 1px);height:20px;width:1px;background:var(--border-default)}
.hw-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@container (min-width:480px){.hw-cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hw-card{display:flex;flex-direction:column;align-items:center;gap:12px}
.hw-card span{font-size:15px;color:var(--text-secondary)}
.hw-ico{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--border-default);background:var(--bg-elevated);color:var(--accent)}
.hw-ico.dash{border-style:dashed;border-color:var(--border-dashed)}
.hw-ico svg{width:36px;height:36px}
.hw-card .hw-aa{font-family:var(--f-en);font-weight:700;font-size:22px;color:var(--accent)}
.ba{display:flex;flex-direction:column;gap:16px}
.ba-b,.ba-a{padding:20px;border-radius:12px;background:var(--bg-elevated)}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:24px;margin-top:12px;position:relative}
.flow>*{position:relative}
.flow>*:not(:last-child)::after{content:"";position:absolute;left:50%;bottom:-24px;height:24px;width:1px;background:var(--text-disabled)}
.fn{align-self:center;display:flex;align-items:baseline;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--border-default);font-size:15px;font-weight:600;color:var(--text-primary)}
.fn small,.split small{font-size:12px;font-weight:500;color:var(--text-tertiary)}
.fn.on{border-color:var(--accent);color:var(--accent)}
.loop{padding:16px;border:1px dashed var(--border-dashed);border-radius:12px;display:flex;flex-direction:column;gap:10px}
.loop-t{font-size:13px;font-weight:600;color:var(--text-tertiary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span,.split span{padding:6px 10px;border-radius:8px;background:var(--bg-placeholder);font-size:14px;color:var(--text-secondary)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Case 모달 안 표 라벨도 Case 01 단계 라벨과 같은 굵기 */
.hwm .ttable th,.hwm .ttable td::before{font-weight:400}
.split>div{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border:1px solid var(--border-default);border-radius:12px}
@media (max-width:767px){.lane{padding:16px 12px}.lane-h,.lane-r{column-gap:10px}.lane-c{padding:8px 12px;font-size:14px}.ba-b,.ba-a{padding:16px}}
/* side menu */
.sidemenu{display:none}
.sm-item{display:flex;align-items:center;width:100%;height:42px;padding:14px 16px;border-radius:8px;font-family:var(--f-en);font-weight:700;font-size:14px;line-height:1;color:var(--text-tertiary);text-decoration:none;transition:background .2s,color .2s}
.sm-item:hover{background:var(--bg-elevated)}
.sm-item.on{background:rgba(79,209,192,.08);color:var(--text-primary)}
/* 모달 레이아웃: 히어로(제목 · 한 줄 소개 · 대표 이미지 · 정보) → 구분선 → 본문 */
.mv{display:flex;flex-direction:column;gap:60px}
.mh{display:flex;flex-direction:column;gap:32px}
.mh-title{display:flex;flex-direction:column}

.mh-title p{margin:0;font-size:18px;line-height:1.6;letter-spacing:-.01em;color:var(--text-primary)}
.mh .props-box{padding:8px 20px 0}
.mh > .fig{width:100%;max-width:1920px;margin-inline:auto}   /* 히어로 대표 이미지 최대 1920, 가운데 */

.mc{display:grid;grid-template-columns:minmax(0,880px);justify-content:end;padding:0 20px;width:100%;max-width:1280px;margin-inline:auto;box-sizing:border-box}

 .modal.full .mc{grid-template-columns:240px minmax(0,880px);justify-content:space-between;column-gap:40px}  /* 본문 880을 먼저 채우고 남는 폭을 간격으로 */
 .modal.full .sidemenu{display:flex;flex-direction:column;gap:4px;position:sticky;top:24px;align-self:start}
}
/* Side 모달: 폭 640 · 정보 2열 · 간격 48 */
.modal.side .mv{gap:32px}   /* 히어로 · 구분선 · 본문 사이 32 */
.modal.side .mh-title h2{font-size:48px;line-height:1.6}

.modal.side .props{grid-template-columns:repeat(2,minmax(0,1fr))}
.modal.side .imgs{gap:16px}
.sd .tall{aspect-ratio:3/8;width:100%}
/* 모바일 */
@media(max-width:767px){
 .mv,.modal.side .mv{gap:32px}
 .mh{gap:24px}
 .mh-title h2,.modal.side .mh-title h2{font-size:36px;line-height:1.2}
 /* 카피 → 이미지 16 (모바일은 모달 한 가지라 전부 적용) */
 .mv.ct,.modal.side .mv.ct{gap:16px}
 .mh-title:not(:last-child),.modal.side .mh-title:not(:last-child){margin-bottom:-8px}
 .mh-title p{font-size:18px;margin-top:8px}
 .mh .props-box,.modal.side .mh .props-box{padding:0;margin-top:4px}   /* 이미지 → 정보 28 (히어로 간격 24 + 4) */
 .props,.modal.side .props{grid-template-columns:1fr;gap:8px}
 .prop{display:grid;grid-template-columns:76px 1fr;gap:12px}
 .prop dt{line-height:1.75}
 .mc{padding:0}
 .mc-body,.modal.side .mc-body{gap:48px}
}
/* 좁은 영역(Side 모달 · 모바일): media 세로 쌓기, table은 행마다 카드 */
/* media: 시안 비율(글 280 : 이미지 560)을 지킬 수 없는 폭(본문 880 미만)이면 바로 세로로 쌓기 */
@container (max-width:879.98px){
 .media{flex-direction:column;gap:16px}
 .media .fig{flex-basis:auto;width:100%}
}
@container (max-width:640px){
 .ttable thead{display:none}
 .ttable,.ttable tbody,.ttable tr,.ttable td{display:block;width:100%}
 .ttable tr{padding:12px 0;border-bottom:1px solid var(--border-default)}

 .ttable td::before{content:attr(data-th);font-weight:600;font-size:14px;line-height:1.6;color:var(--text-tertiary)}
}

 problem:"발전량, 수익, 운영 정보처럼 성격이 다른 데이터가 같은 비중으로 노출되고 있었습니다. 현재 상태를 빠르게 파악해야 하는 서비스인데, 실시간으로 변하는 정보와 필요할 때만 조회하는 정보가 섞여 있어 핵심을 찾는 데 시간이 걸렸습니다.",
 decisions:[
  ["모든 정보를 같은 중요도로 보여주지 않는다","KPI는 첫 화면 히어로 영역에, 주요 데이터는 단독 섹션에, 보조 정보는 탭으로 묶었습니다. 전체 스크롤은 줄이고 필요한 정보에는 계속 접근할 수 있게 했습니다.","IA 다이어그램: KPI · Revenue · Information · Utility"],
  ["일반 정보와 실시간 데이터를 섹션으로 분리","확인 목적이 다른 두 종류의 데이터를 나누고, 수익 정보는 핵심 수치와 3개월 추이를 함께 보도록 위계를 강화했습니다.","와이어프레임 → Hi-fi 비교"],
  ["반복되는 데이터는 하나의 카드 규칙으로","Data Level 1(핵심 지표) · Level 2(주요 지표) · Level 3(상세 데이터)로 카드 모듈을 정의해, 데이터가 늘어나도 같은 규칙으로 대응하게 했습니다.","카드 컴포넌트"],
  ["화면 크기마다 배치를 다르게","넓은 화면에서는 주요 정보를 병렬로 배치하고, 정보량이 적은 페이지는 읽기 폭을 제한했습니다. 공통 시각 기준은 Figma 베리어블(Primitive → Semantic Token)로 관리했습니다.","반응형 비교 + 베리어블 구조",SL("wide",[["반응형 비교","","반응형"],["베리어블 Primitive","","Primitive"],["베리어블 Semantic","","Semantic"]])]],

 result:"첫 화면에서 핵심 지표를 바로 확인하는 구조를 만들고, 반복 데이터의 표현 기준을 하나로 통일했습니다. 화면을 그리기 전에 '사용자가 무엇을 가장 먼저 판단해야 하는가'를 정하는 것이 대시보드 설계의 출발점이라는 것을 다시 확인한 프로젝트입니다."},
{id:"counselling", name:"Counselling Service", desc:"B2B 화상 상담에서 B2C 심리상담 앱까지", cat:"Healthcare", year:"2022–2023", type:"Web · App",

 lead:"운영된 B2B 상담 서비스를 바탕으로, B2C 심리상담 앱을 다시 설계하다",
 stages:[
  ["reil (B2B)",[["기간","2022.04 · 8주"],["플랫폼","PC Web · 화상 상담(PC/Mobile)"],["역할","웹 서브 페이지, 화상 상담 화면 UI (기여도 80%)"],["팀","기획·개발 협업"],["툴","Adobe XD"],["상태","운영"]]],
  ["Good Listener (B2C)",[["기간","2023.02–03 · 2주"],["플랫폼","Mobile App · 상담사 Web"],["역할","User Flow, Mobile UI, 화상 상담 UI (기여도 100%)"],["팀","기획 2 · 프론트엔드 1 · UI 1"],["툴","Adobe XD"],["상태","컨셉 제안"]]]],
 overview:"의사 커뮤니티 interMD 안에서 운영된 정신건강 상담 서비스 reil과, 이를 일반 사용자 대상으로 확장한 Good Listener의 UI를 설계했습니다. 계정 권한에 따라 상담사와 내담자의 화면이 다르고, 상담 신청부터 실제 화상 상담까지 이어지는 서비스입니다.",
 problem:"한 서비스 안에 상담사와 내담자, 실시간 상담과 쪽지 상담, 영상·음성·채팅이라는 서로 다른 조건이 겹쳐 있었습니다. 같은 기능이라도 누가, 어떤 상담 방식으로 쓰는지에 따라 필요한 정보가 달랐습니다.",
 decisions:[
  ["@Part 1. reil (B2B)"],
  ["상담 유형마다 신청 흐름을 다르게","실시간 상담과 쪽지 상담을 유형별로 다르게 신청하도록 하고, 상담 동의 → 사전 질문 → 예약 완료로 단계를 나눴습니다. 상담사마다 다른 질문지에 맞춰 질문별 답변 서식(예/아니요, 추가 설명 입력, 필수 항목 오류 표시)을 정의했습니다.","신청 단계 화면",SL("wide",[["상담 동의","","동의"],["사전 질문","","질문"],["예약 완료","","완료"]])],
  ["상담사는 '오늘 무엇을 해야 하는지'부터","상담사 첫 화면은 내담자별 항목을 가장 가까운 예약순으로 정렬하고, 상담일이 오늘이면 '오늘' 태그를 붙였습니다. 주력인 실시간 상담과 보조인 쪽지 상담은 비대칭으로 나눠 비중을 구분했습니다.","상담사 메인 리스트"],
  ["예외 상황을 먼저 화면으로","예약 없음·완료 없음·전체 없음의 빈 상태, 카메라 off, 프로필 이미지 없음, 상담 시간 임박, 상담사 대기 화면을 각각 설계했습니다. 알림은 상황의 무게에 따라 Alert · Layer · Toast로 나눠 PC와 모바일에 공통 적용했습니다.","상태별 화면 그리드",SL("wide",[["빈 상태","","빈 상태"],["카메라 off","","카메라"],["시간 임박","","임박"],["상담사 대기","","대기"]])],
  ["@Part 2. Good Listener (B2C)"],
  ["사용자의 역할이 바뀌었는데, 필요한 기능도 같을까?","B2B 상담사 화면은 내담자 노트, 상담 일지, 상담 내용 기록, 채팅이 한 화면에 모인 복합 화면이었습니다. B2C 내담자에게 필요한 것은 오직 상담이라고 판단해, 영상 중심의 단일 화면으로 바꾸고 채팅 알림은 필요한 것만 가볍게, 컨트롤은 필수 기능만 하단에 두고 기본은 숨겼습니다.","B2B 상담사 화면 ↔ B2C 영상 화면"],
  ["감성으로 선택하고, 결정은 이성적으로","상담사 목록에서는 실제 프로필 사진, 이력 대신 마음을 여는 소개 한마디, 최소한의 평점만 보여주고, 상세 화면에서 경력·자격과 이용자 후기로 판단 근거를 제공했습니다.","목록 → 프로필 상세"]],
 screens:["reil 상담사 메인 (PC)","reil 화상 상담 (Mobile)","Good Listener 홈 · 상담사 프로필"],
 result:"reil은 interMD 서비스에 실제 적용되어 운영되었고, Good Listener는 컨셉 단계에서 메인 시안 2종과 대표 페이지 3종의 hi-fi 디자인, 디자인 가이드까지 제안했습니다. 같은 경험을 다른 사용자에게 옮길 때, 기능을 그대로 가져오기보다 역할에 맞게 다시 고르는 과정이 필요하다는 것을 배웠습니다."},
{id:"groupbuying", name:"Group Buying", desc:"주문부터 취소·반품까지 설계한 공동구매 커머스", cat:"Commerce", year:"2022", type:"Web",

 lead:"의사 회원이 포인트로 생활용품을 구매하는 공동구매, 주문 이후까지 설계하다",
 info:[["기간","2022.05"],["플랫폼","PC Web"],["역할","PC UI 디자인, 주간 이벤트 페이지 디자인 (모바일 UI는 다른 디자이너 담당)"],["팀","디자인팀 협업"],["툴","Adobe XD"],["상태","운영"]],
 overview:"interMD 플랫폼에 새로 도입된 결제 기능, 공동구매의 PC 화면을 설계했습니다. 생활용품·가전·상품권을 회원 포인트와 함께 구매하는 서비스로, 상품 목록부터 주문·결제, 마이페이지의 주문 관리와 알림 메일까지가 범위였습니다.",
 problem:"결제가 처음 도입되는 서비스라, 결제 완료 이후에 생기는 상황 — 배송 중, 배송 완료, 배송지 변경, 취소·교환·반품 — 을 사용자가 스스로 처리할 수 있는 화면이 함께 필요했습니다.",
 decisions:[
  ["구매 흐름을 끊지 않게","상품 상세 위에서 주문·결제를 레이어로 진행하고, 결제 완료 후 바로 확인 알림을 띄웠습니다. 문의가 필요할 때는 1:1 문의에 해당 상품 정보가 자동으로 붙도록 했습니다.","상세 → 주문/결제 → 완료",SL("wide",[["상품 상세","","상세"],["주문/결제","","결제"],["결제 완료","","완료"]])],
  ["결제 이후의 상태를 모두 화면으로","주문 내역은 결제 완료·배송 중·배송 완료·취소/교환/반품 완료의 4가지 상태로 나누고, 상태에 따라 버튼과 안내를 바꿨습니다. 취소·교환·반품 요청 창은 기본 / 내역 없음 / 최대 높이(스크롤) / 처리 완료 후 입력 불가의 4가지 경우를 설계했습니다.","상태별 화면",SL("wide",[["결제 완료","","결제"],["배송 중","","배송"],["배송 완료","","완료"],["취소/반품 요청","","요청"]])],
  ["선택 전과 후, 길어질 때까지","옵션을 고르기 전에는 구매 버튼을 비활성화하고, 옵션을 여러 개 담거나 상품명이 두 줄을 넘는 경우의 줄바꿈 규칙을 화면에 주석으로 남겨 개발에 전달했습니다. 종료된 공동구매는 목록에서 별도 상태로 구분했습니다.","주석이 포함된 상세 화면"],
  ["출시 이후의 운영까지","공동구매를 알리는 'Thursday Market' 타임딜 이벤트를 회차마다 디자인했습니다. 로고타입과 페이지 구조는 고정하고 회차별 테마만 바꿔, 매번 새롭지만 같은 서비스로 보이게 했습니다.","Thursday Market 대표 회차",null,["o-events","Event & Banner에서 전체 회차 보기"]]],
 screens:["공동구매 목록","주문 내역 (상태 4종)",SL("free",[["주문 내역 메일","","주문","3/4"],["발송 메일","","발송","3/4"],["취소 완료 메일","","취소","3/4"]])],
 result:"공동구매는 interMD에 적용되어 운영되었고, 신규 결제 프로세스의 UI 기준을 만들었습니다. 결제가 들어간 서비스에서는 메인 화면만큼 예외 상태의 화면이 중요하다는 것을 배웠습니다."},
{id:"lesson365", name:"Lesson 365", desc:"강의 중에도 길을 잃지 않도록 개선한 화상교육 플랫폼", cat:"Education", year:"2021", type:"Web",
 thumb:"대표 이미지 — 발표형 강의 화면 (To-be)",
 lead:"기존 화상교육 서비스를 분석해, 강의 중에도 길을 잃지 않는 화면으로 개선하다",
 info:[["기간","2021.05–07"],["플랫폼","PC Web"],["역할","기존 서비스 분석, 레퍼런스 수집, UX/UI 개선, 화면 디자인 (기여도 70%)"],["팀","월드버텍 내부 연구과제 팀"],["툴","Adobe XD · Illustrator"],["상태","디자인 전달 후 개발 진행"]],
 overview:"비대면 강의를 위한 웹 기반 화상교육·회의 플랫폼의 2.0 개선 작업입니다. 서비스의 톤앤매너는 유지하면서, 기능 구성과 화면 전반을 다시 설계했습니다.",
 problem:"영역이 흩어져 있고 메뉴 그룹 기준이 모호했습니다. 토글과 호버 뒤에 숨겨진 메뉴가 많아 사용성이 떨어졌고, 아이콘도 직관적이지 않았습니다. 화상 화면은 인원이 늘 때마다 그리드가 실시간으로 분할·재배치되어 레이아웃을 정할 수 없었고, 강사·발표자·학습자의 구분도 불분명했습니다.",
 decisions:[
  ["시선 흐름대로 메뉴를 고정","헤더와 하단 메뉴를 없애고, 기능과 비중이 비슷한 메뉴끼리 묶어 고정했습니다. 사용자의 시선이 움직이는 순서(상단 → 좌측 → 우측)에 따라 상단에는 전체 메뉴·타이틀·설정, 좌측에는 화면 공유·화이트보드 같은 화면 기능, 우측에는 채팅·참석자 같은 부가 기능을 두었습니다.","초기 화면 As-is ↔ To-be",SL("wide",[["As-is",""],["To-be",""]])],
  ["그리드는 사용자가 정하게","접속 인원에 따라 바뀌던 그리드 대신 그리드 우선 지정 방식을 제안해 렌더링 부담을 줄이고, 학습·회의·토의 상황에 맞게 격자형과 발표형 중 고를 수 있게 했습니다. 권한에 따라 아이콘을 구분해 혼란을 줄였습니다.","그리드 As-is ↔ To-be",SL("wide",[["As-is",""],["To-be",""]])],
  ["권한과 사생활을 함께 고려","관리자가 참석자의 카메라·마이크를 요청할 때는 동의 팝업을 거치게 해 권한을 주더라도 사생활 침해가 생기지 않게 했습니다. 채팅 알림은 레이어 팝업으로 바꿔 강의 화면을 벗어나지 않고 확인하게 했습니다.","우측 메뉴 As-is ↔ To-be",SL("wide",[["As-is",""],["To-be",""]])],

const UIG=ORDER.map(([k,id])=>k+"-"+id); /* UX/UI 12개는 Works 그리드 순서와 동일한 하나의 순서 */
function findModal(token){
 let m;
 if((m=token.match(/^p-(.+)$/))){const j=FULL.findIndex(p=>p.id===m[1]);if(j>-1)return{kind:"full",group:UIG,i:UIG.indexOf(token),p:FULL[j],title:FULL[j].name,meta:metaLine(FULL[j])}}
 if((m=token.match(/^o-(.+)$/))){const j=SIDE.findIndex(p=>p.id===m[1]);if(j>-1)return{kind:"side",group:UIG,i:UIG.indexOf(token),p:SIDE[j],title:SIDE[j].name,meta:metaLine(SIDE[j])}}
 if((m=token.match(/^c(\d+)$/))){const i=+m[1]-1;if(CONTENT[i])return{kind:"side",group:CONTENT.map(c=>c.id),i,c:CONTENT[i],title:CONTENT[i].title,meta:CONTENT[i].type}}
 if(HWG.includes(token)){const i=HWG.indexOf(token);return{kind:"side",group:HWG,i,k:HW[i],title:HW[i].card.replace(/^Case \d+\. /,""),meta:HW[i].no}}
 return null;
}

/* side menu: 본문 스크롤에 따라 현재 섹션 표시 */
let spyOff=null, spyLock=0;
function spyMark(id){document.querySelectorAll("#mInner .sm-item").forEach(a=>a.classList.toggle("on",a.dataset.jump===id))}
function setupSpy(){
 if(spyOff){spyOff();spyOff=null}
 const menu=document.querySelector("#mInner .sidemenu"); if(!menu) return;
 const body=$("#mBody"), ids=[...menu.querySelectorAll(".sm-item")].map(a=>a.dataset.jump), secs=ids.map(id=>document.getElementById(id)).filter(Boolean); if(!secs.length) return;
 let raf=0;
 const calc=()=>{raf=0; if(Date.now()<spyLock) return;
  const top=body.getBoundingClientRect().top, line=top+120;
  let cur=secs[0].id;
  /* 끝까지 스크롤하면 마지막 섹션(Result)을 표시 — 짧은 마지막 섹션도 닿도록 */
  if(body.scrollTop+body.clientHeight>=body.scrollHeight-4) cur=secs[secs.length-1].id;
  else secs.forEach(el=>{if(el.getBoundingClientRect().top<=line) cur=el.id});
  spyMark(cur)};
 const on=()=>{if(!raf) raf=requestAnimationFrame(calc)};
 body.addEventListener("scroll",on,{passive:true});
 spyOff=()=>body.removeEventListener("scroll",on);
}

/* 이미지 스켈레톤: 다 받고 그릴 준비(decode)가 끝나면 한 프레임에 교체 · 이미 받아 둔 이미지는 바로 표시 */
/* 단계 슬라이더 동작: 화살표 · 단계 라벨 · 스와이프 · 키보드(←/→) — 현재 단계는 스크롤 위치로 계산 */
function setupSliders(root){
 root.querySelectorAll("[data-slider]").forEach(sl=>{
  const tr=sl.querySelector(".sl-track"), steps=[...sl.querySelectorAll(".sl-step")], prev=sl.querySelector('[data-sl-move="-1"]'), next=sl.querySelector('[data-sl-move="1"]'), n=steps.length;
  const cur=()=>Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));
  const view=sl.querySelector(".sl-view"), slides=[...sl.querySelectorAll(".sl-slide")], free=sl.dataset.frame==="free";
  const fitH=i=>{if(!free) return; const h=slides[i].offsetHeight; if(h) view.style.height=h+"px"};   /* 숨겨진 상태(높이 0)에서는 재지 않음 */   /* free: 패널 높이 = 현재 장 높이 */
  const cnt=sl.querySelector(".sl-count b");
  const mark=()=>{const i=Math.min(n-1,Math.max(0,cur())); fitH(i); cnt.textContent=i+1; steps.forEach((b,j)=>j===i?b.setAttribute("aria-current","step"):b.removeAttribute("aria-current")); prev.disabled=i===0; next.disabled=i===n-1};
  const go=i=>tr.scrollTo({left:Math.min(n-1,Math.max(0,i))*tr.clientWidth,behavior:RM()?"auto":"smooth"});
  let raf=0; tr.addEventListener("scroll",()=>{if(!raf) raf=requestAnimationFrame(()=>{raf=0;mark()})},{passive:true});
  steps.forEach((b,j)=>b.addEventListener("click",()=>go(j)));
  prev.addEventListener("click",()=>go(cur()-1)); next.addEventListener("click",()=>go(cur()+1));
  tr.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();go(cur()+1)} else if(e.key==="ArrowLeft"){e.preventDefault();go(cur()-1)}});
  /* 한 줄에 라벨이 다 안 들어가면 compact (폭이 바뀔 때마다 다시 계산) */
  const box=sl.querySelector(".sl-steps"), unnamed=steps.every(b=>b.classList.contains("num")), over=()=>box.scrollWidth>box.clientWidth+1, fit=()=>{sl.classList.remove("compact","nums","count"); if(unnamed){sl.classList.add("count"); fitH(Math.min(n-1,Math.max(0,cur()))); return} if(over()) sl.classList.add("compact"); if(over()) sl.classList.add("nums"); if(over()) sl.classList.add("count"); fitH(Math.min(n-1,Math.max(0,cur())))};
  if("ResizeObserver" in window){const ro=new ResizeObserver(fit); ro.observe(sl.querySelector(".sl-ctl")); if(free) slides.forEach(x=>ro.observe(x))} else fit();
  if(free) sl.querySelectorAll(".sl-free>img").forEach(im=>im.addEventListener("load",()=>fitH(Math.min(n-1,Math.max(0,cur()))),{once:true}));
  mark(); fit();
 });
}
function skel(root){
 root.querySelectorAll(".thumb>img,.fig>img,.sl-phone>img,.sl-shot>img,.sl-free>img").forEach(img=>{
  const box=img.parentElement;
  if(img.complete&&img.naturalWidth) return;
  box.classList.add("sk"); if(box.classList.contains("fig")&&!img.getAttribute("width")) box.classList.add("noratio");
  img.addEventListener("load",()=>{(img.decode?img.decode():Promise.resolve()).catch(()=>{}).then(()=>box.classList.remove("sk","noratio"))},{once:true});
  img.addEventListener("error",()=>{box.classList.remove("sk");box.classList.add("sk-err")},{once:true});
 });
}
/* 큰 제목을 기기 픽셀 경계에 맞춤: 소수점 위치에서 생기는 번짐·스크롤 일렁임 방지 */
const SNAP=".hero-ghost,.hc-title,.page-head h1,.contact-title,.ab-ct";
function snapPx(){
 const d=window.devicePixelRatio||1;
 document.querySelectorAll(SNAP).forEach(el=>{
  const cur=parseFloat(el.style.getPropertyValue("--snap"))||0;
  const y=(el.getBoundingClientRect().top+window.scrollY-cur)*d;
  const off=(Math.round(y)-y)/d;
  el.style.setProperty("--snap",Math.abs(off)<.001?"0px":off.toFixed(4)+"px");
 });
}
let snapRaf=0; const snapSoon=()=>{cancelAnimationFrame(snapRaf);snapRaf=requestAnimationFrame(snapPx)};
window.addEventListener("resize",snapSoon);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(snapSoon);
/* 탭 밑줄: 이전 탭 위치에서 새 탭 위치로 이동 */
let lastInk=null, tabSwitch=false, inkFrom=null, inkUntil=0;
function placeInk(animate){
 const tabs=document.querySelector(".tabs"); if(!tabs){lastInk=null;return}
 const sel=tabs.querySelector('.tab[aria-selected="true"]'); if(!sel) return;
 let ink=tabs.querySelector(".tab-ink");
 if(!ink){ink=document.createElement("span");ink.className="tab-ink";ink.setAttribute("aria-hidden","true");tabs.appendChild(ink);tabs.classList.add("has-ink")}
 const to={x:sel.offsetLeft,w:sel.offsetWidth};
 const set=(o)=>{ink.style.transform=`translateX(${o.x}px)`;ink.style.width=o.w+"px"};
 ink.classList.add("no-anim");
 /* 탭 클릭 직후 주소 변경으로 한 번 더 그려져도 이동이 끊기지 않게 출발점 유지 */
 if(animate&&lastInk){inkFrom=lastInk;inkUntil=Date.now()+350}
 else if(Date.now()<inkUntil&&inkFrom){animate=true}
 if(animate&&inkFrom){set(inkFrom);void ink.offsetWidth;ink.classList.remove("no-anim");set(to)}
 else {set(to);void ink.offsetWidth;ink.classList.remove("no-anim")}
 lastInk=to;
}
window.addEventListener("resize",()=>placeInk(false));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>placeInk(false));
/* ===== About 일러스트 · Core 아이콘 · 지구본 애니메이션 ===== */
const RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
let fxIO=[];
function fxClear(){fxIO.forEach(o=>o.disconnect());fxIO=[];globeStop()}
function playIcon(card){
 card.classList.remove("cs-play"); void card.offsetWidth; card.classList.remove("cs-pre"); card.classList.add("cs-play");
 const a=card.querySelector(".cs-grid animate"); if(a&&a.beginElement){try{a.beginElement()}catch(e){}}
}
function fxSetup(){
 fxClear(); if(RM()) { globeDraw(0,-1); return; }
 const art=document.querySelector(".about-art");
 if(art&&"IntersectionObserver" in window){
  art.classList.add("pre");
  const o=new IntersectionObserver(es=>es.forEach(e=>{
   if(e.isIntersecting){ if(art.classList.contains("pre")){art.classList.remove("pre");art.classList.add("play")} art.classList.remove("paused") }
   else if(art.classList.contains("play")) art.classList.add("paused");
  }),{threshold:.3}); o.observe(art); fxIO.push(o);
 }
 const cards=[...document.querySelectorAll(".core-item")];
 if(cards.length&&"IntersectionObserver" in window){
  cards.forEach(c=>{c.classList.add("cs-pre"); if(matchMedia("(hover:hover)").matches) c.addEventListener("mouseenter",()=>playIcon(c))});
  /* 스크롤 위치에 맞춰 재생: 아이콘이 화면 위에서 65% 선을 지나면 그 아이콘만 한 번 재생 · 이후에는 hover 때만 */
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){playIcon(e.target);o.unobserve(e.target)}}),{rootMargin:"0px 0px -35% 0px",threshold:0});
  cards.forEach(c=>o.observe(c)); fxIO.push(o);
 }
 const g=document.querySelector(".globe-svg");
 if(g){ globeDraw(0,-1);
  if("IntersectionObserver" in window){const o=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?globeStart():globeStop()),{threshold:0}); o.observe(g); fxIO.push(o)} }
}
/* 지구본: 선으로 그린 와이어프레임 · 천천히 자전(한 바퀴 20초) + 청록 신호점 */
const GC={cx:535,cy:299,r:283,tilt:20,elev:38*Math.PI/180};   /* 시안처럼 북극(꼭짓점)이 오른쪽 위에 보이도록 */
let gRaf=0,gT0=0,gTh=0;
function gProj(lat,lon){const e=GC.elev,x=Math.cos(lat)*Math.sin(lon),y=Math.sin(lat),z=Math.cos(lat)*Math.cos(lon);
 const y2=y*Math.cos(e)-z*Math.sin(e), z2=y*Math.sin(e)+z*Math.cos(e); return [GC.cx+GC.r*x, GC.cy-GC.r*y2, z2]}
function gPaths(pts){let f="",b="",pf=null,pb=null;
 pts.forEach(([x,y,z])=>{const P=x.toFixed(1)+" "+y.toFixed(1);
  if(z>=0){f+=(pf?"L":"M")+P;pf=1;pb=0;} else {b+=(pb?"L":"M")+P;pb=1;pf=0;} }); return [f,b]}
function globeDraw(theta,sig){
 const g=document.querySelector(".globe-svg"); if(!g) return;
 if(!g.firstChild){g.innerHTML=`<g transform="rotate(${GC.tilt} ${GC.cx} ${GC.cy})"><g class="g-back"></g><circle class="gl" cx="${GC.cx}" cy="${GC.cy}" r="${GC.r}"/><g class="g-front"></g><circle class="gsig-h" r="16" cx="0" cy="0" style="opacity:0"/><circle class="gsig" r="6" cx="0" cy="0" style="opacity:0"/></g>`}
 let F="",B="";const N=64,D=Math.PI;
 for(let la=-60;la<=60;la+=30){const pts=[];for(let i=0;i<=N;i++)pts.push(gProj(la*D/180,i/N*2*D));const [f,b]=gPaths(pts);F+=f;B+=b}
 for(let m=0;m<8;m++){const lon=m*D/8+theta,pts=[];for(let i=0;i<=N;i++)pts.push(gProj(-D/2+i/N*D,lon));const [f,b]=gPaths(pts);F+=f;B+=b;
  const pts2=[];for(let i=0;i<=N;i++)pts2.push(gProj(-D/2+i/N*D,lon+D));const [f2,b2]=gPaths(pts2);F+=f2;B+=b2}
 g.querySelector(".g-front").innerHTML=`<path class="gl" d="${F}"/>`; g.querySelector(".g-back").innerHTML=`<path class="gl back" d="${B}"/>`;
 const s=g.querySelector(".gsig"),h=g.querySelector(".gsig-h");
 if(sig<0){s.style.opacity=0;h.style.opacity=0;return}
 /* 신호점: 앞면 호를 따라 남→북으로 이동하며 나타났다 사라짐 */
 const [x,y]=gProj(-D/2.6+sig*D/1.3,.35), a=Math.sin(sig*D);
 s.setAttribute("cx",x.toFixed(1));s.setAttribute("cy",y.toFixed(1));s.style.opacity=a;h.setAttribute("cx",x.toFixed(1));h.setAttribute("cy",y.toFixed(1));h.style.opacity=a*.18;
}
function globeStart(){ if(gRaf||RM()) return; gT0=performance.now()-gTh*20000/(2*Math.PI);
 const step=t=>{gTh=((t-gT0)/20000)*2*Math.PI; const sp=((t-gT0)%6000)/6000; globeDraw(gTh%(2*Math.PI), sp<.75?sp/.75:-1); gRaf=requestAnimationFrame(step)}; gRaf=requestAnimationFrame(step)}
function globeStop(){ if(gRaf){cancelAnimationFrame(gRaf);gRaf=0} }
document.addEventListener("visibilitychange",()=>{if(document.hidden){globeStop();return} const g=document.querySelector(".globe-svg"); if(g){const r=g.getBoundingClientRect(); if(r.bottom>0&&r.top<innerHeight) globeStart()}});
/* ---------- RENDER ---------- */
let heroIO=null;
function render(){
 $("#app").innerHTML = state.view==="work"?viewWork():state.view==="about"?viewAbout():viewHome(); skel($("#app")); fxSetup(); snapSoon(); placeInk(tabSwitch); tabSwitch=false;
 if(heroIO){heroIO.disconnect();heroIO=null}
 const hero=document.querySelector(".hero"), row=$("#allRow");
 if(hero&&row&&"IntersectionObserver" in window){
  /* Hero가 절반 이상 가려지면 나타남 (완전히 사라질 때까지 기다리지 않음) */
  heroIO=new IntersectionObserver(([en])=>row.classList.toggle("pre",en.intersectionRatio>=0.5),{rootMargin:"-92px 0px 0px 0px",threshold:[0,0.25,0.5,0.75,1]});
  heroIO.observe(hero);
 } else if(row){ row.classList.remove("pre"); }
 document.querySelectorAll("nav.menu [data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===state.view?"page":"false"));
}
function renderModal(){
 const mod=$("#modal"), scrim=$("#scrim");
 const info=state.modal?findModal(state.modal):null;
 if(!info){
  if(!mod.hidden){mod.classList.remove("open");scrim.classList.remove("on");document.body.classList.remove("lock");
   setTimeout(()=>{if(!state.modal){mod.hidden=true;scrim.hidden=true}},350); if(lastFocus) lastFocus.focus({preventScroll:true});}
  return;
 }
 const fill=()=>{
  $("#mTag").textContent=info.k?"How I Work":info.c?"Content":"UI/UX";
  $("#mTitle").textContent=info.title; mod.classList.toggle("is-content",!!(info.c||info.k));
  $("#mInner").innerHTML = info.p ? (info.kind==="full"?fullHTML(info.p):sideHTML(info.p)) : info.k ? caseHTML(info.k) : contentHTML(info.c); skel($("#mInner")); setupSliders($("#mInner"));
  const g=info.group; $("#mPrev").disabled=info.i===0; $("#mNext").disabled=info.i===g.length-1;
  $("#mBody").scrollTop=0;
  setupSpy();
 };
 if(mod.hidden){
  mod.className="modal "+info.kind; fill();
  mod.hidden=false;scrim.hidden=false;document.body.classList.add("lock");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{mod.classList.add("open");scrim.classList.add("on")}));
  setTimeout(()=>$("#mClose").focus({preventScroll:true}),50);
 } else {
  /* 열린 상태에서 전환: 내용 페이드 아웃 → 크기(left) 전환 + 내용 교체 → 페이드 인 */
  const body=$("#mBody"); body.classList.add("swap");
  setTimeout(()=>{ mod.className="modal "+info.kind+" open"; fill(); requestAnimationFrame(()=>body.classList.remove("swap")); }, matchMedia("(prefers-reduced-motion: reduce)").matches?0:180);
 }
}
function renderContact(){
 setTimeout(snapSoon,600);
 const p=$("#cpanel"), s=$("#cscrim"), b=$("#contactBtn");
 b.textContent=state.contact?"Close":"Contact"; b.setAttribute("aria-expanded",state.contact);
 document.body.classList.toggle("contact-open",!!state.contact);
 if(state.contact){
  $("#cpanelInner").innerHTML=contactBox();
  p.hidden=false;s.hidden=false;document.body.classList.add("lock");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{p.classList.add("open");s.classList.add("on")}));
 } else if(!p.hidden){
  p.classList.remove("open");s.classList.remove("on");
  if(!state.modal) document.body.classList.remove("lock");
  setTimeout(()=>{if(!state.contact){p.hidden=true;s.hidden=true}},450);
 }
}
function hashFor(){ if(state.contact) return "contact"; if(state.modal) return state.modal; if(state.view==="work") return state.tab==="content"?"content":"work"; return state.view; }
function pushHash(){const h=hashFor(); if(location.hash.slice(1)!==h) location.hash=h; }
function fromHash(){
 const h=location.hash.slice(1)||"home";
 state.contact = h==="contact";
 if(state.contact){ state.modal=null; }
 else if(h==="home"||h==="about"){state.view=h;state.modal=null}
 else if(h==="work"){state.view="work";state.tab="ui";state.modal=null}
 else if(h==="content"){state.view="work";state.tab="content";state.modal=null}
 else if(findModal(h)){ state.modal=h;
   if(h.startsWith("hw")){state.view="about"}
   else if(h.startsWith("c")){state.view="work";state.tab="content"}
   else if(h.startsWith("o-")&&state.view==="home"){state.view="work";state.tab="ui"} }
 else {state.view="home";state.modal=null}
 render(); renderModal(); renderContact();
}
function go(view){state.view=view;state.modal=null;state.contact=false;if(view==="work")state.tab=state.tab||"ui";window.scrollTo(0,0);pushHash();render();renderModal();renderContact()}
function openModal(tok,trigger){lastFocus=trigger||document.activeElement;state.contact=false;renderContact();state.modal=tok;pushHash();renderModal()}
function swapModal(tok){state.modal=tok;history.replaceState(null,"","#"+tok);renderModal()}
function closeModal(){ if(!state.modal) return; state.modal=null; history.replaceState(null,"","#"+hashFor()); renderModal(); }
function toggleContact(force){ const on = force===undefined?!state.contact:force; if(on===state.contact) return;
 if(on){ state.modal=null; renderModal(); } state.contact=on; history.replaceState(null,"","#"+hashFor()); renderContact(); }

/* ---------- EVENTS ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-open],[data-tab],[data-swap],[data-copy],[data-resume],[data-jump],[data-contact]");
 if(!t) return;
 if(t.hasAttribute("data-contact")){e.preventDefault();toggleContact()}
 else if(t.dataset.go){e.preventDefault();go(t.dataset.go)}
 else if(t.dataset.open){e.preventDefault();openModal(t.dataset.open,t)}
 else if(t.dataset.tab){if(t.dataset.tab!==state.tab){state.tab=t.dataset.tab;tabSwitch=true;pushHash();render()}}
 else if(t.dataset.swap){e.preventDefault();swapModal(t.dataset.swap)}
 else if(t.dataset.jump){e.preventDefault();const el=document.getElementById(t.dataset.jump);if(el){spyMark(t.dataset.jump);spyLock=Date.now()+900;el.scrollIntoView({behavior:"smooth",block:"start"})}}
 else if(t.dataset.copy){const v=t.dataset.copy;
   const msg=v.includes("gmail")?"Gmail 주소가 복사되었습니다.":"Naver 메일 주소가 복사되었습니다.";
   navigator.clipboard?.writeText(v).then(()=>toast(msg),()=>toast(v)) ?? toast(v)}
 else if(t.dataset.resume){toast(t.dataset.resume==="view"?"이력서 PDF가 새 탭에서 열립니다 (연결 예정)":"이력서 PDF가 다운로드됩니다 (연결 예정)")}
});
$("#mClose").onclick=closeModal;
$("#scrim").onclick=()=>{ if($("#modal").classList.contains("side")) closeModal(); };
$("#mPrev").onclick=()=>{const f=findModal(state.modal);if(f&&f.group&&f.i>0)swapModal(f.group[f.i-1])};
$("#mNext").onclick=()=>{const f=findModal(state.modal);if(f&&f.group&&f.i<f.group.length-1)swapModal(f.group[f.i+1])};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){ if(state.contact) toggleContact(false); else closeModal(); }});
$("#cscrim").onclick=()=>toggleContact(false);
window.addEventListener("hashchange",fromHash);

$("#mPrev").innerHTML=ICON.left; $("#mNext").innerHTML=ICON.right; $("#mClose").innerHTML=ICON.close;

/* notes */
$("#notesBtn").onclick=function(){const on=document.body.classList.toggle("show-notes");this.setAttribute("aria-pressed",on);this.textContent=on?"기획 주석 숨기기":"기획 주석 보기"};

fromHash();
</script>
</body>
